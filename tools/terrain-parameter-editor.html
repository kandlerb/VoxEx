        navigator.clipboard.writeText(JSON.stringify(currentParams, null, 2))
            .catch((e) => console.error('Failed to copy:', e));
    }

    /**
     * Show a transient note under the export/import controls.
     * @param {string} text - Note text.
     * @returns {void}
     */
    function setImportNote(text) {
        const el = document.getElementById('import-note');
        if (el) el.textContent = text;
    }

    /**
     * Validate and apply an imported plain object: only keys present in
     * VX.DEFAULT_GEN_PARAMS are accepted (others are ignored with a visible note),
     * merged onto the current object (so an omitted key keeps its CURRENT value
     * rather than being reset), then applied + all controls refreshed.
     * @param {object} obj - Parsed JSON object (file or paste).
     * @returns {void}
     */
    function applyImportedObject(obj) {
        const knownKeys = new Set(Object.keys((VX && VX.DEFAULT_GEN_PARAMS) || {}));
        const unknown = [];
        for (const key of Object.keys(obj)) {
            if (knownKeys.has(key)) currentParams[key] = obj[key];
            else unknown.push(key);
        }
        refreshAllControlValues();
        commitParamsChange();
        setImportNote(unknown.length > 0
            ? `Imported. Ignored unknown keys: ${unknown.join(', ')}`
            : 'Imported successfully.');
    }

    /**
     * Import genParams JSON from a File (the "Import JSON File" button's file picker).
     * @param {File} file - The selected JSON file.
     * @returns {void}
     */
    function importJSONFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                applyImportedObject(JSON.parse(e.target.result));
            } catch (err) {
                alert('Invalid JSON file: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    /**
     * Import genParams JSON pasted into a prompt dialog (the "Paste JSON" button).
     * @returns {void}
     */
    function importJSONFromPaste() {
        const text = prompt('Paste genParams JSON:');
        if (!text) return;
        try {
            applyImportedObject(JSON.parse(text));
        } catch (err) {
            alert('Invalid JSON: ' + err.message);
        }
    }

    // ------------------------------------------------------------
    // AUTOSAVE (localStorage)
    // ------------------------------------------------------------

    /**
     * Autosave the current seed string + genParams object to localStorage.
     * @returns {void}
     */
    function autoSaveParams() {
        try {
            localStorage.setItem(AUTOSAVE_STORAGE_KEY, JSON.stringify({ seed: currentSeedStr, params: currentParams }));
        } catch (e) {
            // Ignore storage errors.
        }
    }

    /**
     * Restore the autosaved seed string + genParams object, if present. Called once
     * at boot, before the first apply/render.
     * @returns {void}
     */
    function loadAutoSave() {
        try {
            const saved = localStorage.getItem(AUTOSAVE_STORAGE_KEY);
            if (!saved) return;
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed.seed === 'string') currentSeedStr = parsed.seed;
            if (parsed && parsed.params && typeof parsed.params === 'object') {
                currentParams = Object.assign({}, VX.DEFAULT_GEN_PARAMS, parsed.params);
            }
        } catch (e) {
            // Ignore errors - fall back to defaults already set by the caller.
        }
    }

    // ------------------------------------------------------------
    // EVENT WIRING
    // ------------------------------------------------------------

    /**
     * Wire every static DOM control (preview toolbar, canvas pan/zoom, header
     * buttons, presets, export/import). Schema-driven param rows wire themselves
     * at build time (see buildNumberRow / buildToggleRow / buildBiomeGridRow).
     * @returns {void}
     */
    function setupEventListeners() {
        const canvas = document.getElementById('preview-canvas');

        // Preview mode buttons.
        document.querySelectorAll('.preview-modes button').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preview-modes button').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                const mode = btn.dataset.mode;
                renderer.setMode(mode);
                document.getElementById('layer-toggles').style.display = mode === 'combined' ? 'flex' : 'none';
            });
        });

        // Quality selector.
        document.getElementById('preview-quality').addEventListener('change', (e) => {
            renderer.setSize(parseInt(e.target.value, 10));
        });

        // Combined-mode layer toggles (Caves removed - CCR-WORLDGEN-UI-001 #7).
        ['terrain', 'biomes', 'rivers'].forEach((layer) => {
            document.getElementById(`layer-${layer}`).addEventListener('change', (e) => {
                renderer.setLayerVisible(layer, e.target.checked);
            });
        });

        // Zoom control buttons.
        document.getElementById('zoom-in').addEventListener('click', () => {
            renderer.zoomAt(1.5, canvas.width / 2, canvas.height / 2);
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            renderer.zoomAt(0.67, canvas.width / 2, canvas.height / 2);
        });
        document.getElementById('zoom-reset').addEventListener('click', () => {
            renderer.resetView();
        });

        // Canvas pan/zoom + cursor info.
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            if (VX && px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                const info = renderer.getInfoAt(px, py);
                document.getElementById('cursor-pos').textContent = `X: ${info.x}, Z: ${info.z}`;
                document.getElementById('cursor-height').textContent = info.height;
                document.getElementById('cursor-biome').textContent = info.biome;
            }

            if (isDragging) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                renderer.pan(dx, dy);
                lastX = e.clientX;
                lastY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.2 : 0.83;
            renderer.zoomAt(factor, x, y);
        }, { passive: false });

        // Seed section.
        document.getElementById('seed-input').addEventListener('change', (e) => handleSeedChange(e.target.value));
        document.getElementById('btn-random-seed').addEventListener('click', randomizeSeed);

        // Header buttons.
        document.getElementById('btn-randomize-all').addEventListener('click', randomizeSeed);
        document.getElementById('btn-reset-all').addEventListener('click', resetToDefaults);

        document.getElementById('btn-undo').addEventListener('click', () => {
            const state = history.undo();
            if (!state) return;
            history.isRestoring = true;
            currentParams = state;
            refreshAllControlValues();
            commitParamsChange(false);
            history.isRestoring = false;
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            const state = history.redo();
            if (!state) return;
            history.isRestoring = true;
            currentParams = state;
            refreshAllControlValues();
            commitParamsChange(false);
            history.isRestoring = false;
        });

        document.addEventListener('keydown', (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            if (e.key === 'z') { e.preventDefault(); document.getElementById('btn-undo').click(); }
            else if (e.key === 'y') { e.preventDefault(); document.getElementById('btn-redo').click(); }
        });

        // Presets.
        document.getElementById('btn-save-preset').addEventListener('click', saveCurrentAsPreset);

        // Export / import.
        document.getElementById('btn-export-json').addEventListener('click', downloadJSON);
        document.getElementById('btn-copy-json').addEventListener('click', copyCurrentParamsToClipboard);
        document.getElementById('btn-copy-voxex').addEventListener('click', copyCurrentParamsToClipboard);
        document.getElementById('btn-import-json').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });
        document.getElementById('import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) importJSONFile(file);
            e.target.value = '';
        });
        document.getElementById('btn-import-paste').addEventListener('click', importJSONFromPaste);
    }

    // ------------------------------------------------------------
    // BOOT
    // ------------------------------------------------------------

    window.addEventListener('load', bootVoxEx);
    </script>
</body>
</html>
