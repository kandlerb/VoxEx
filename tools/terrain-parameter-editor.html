<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxEx Terrain Parameter Editor</title>
    <style>
        /* ============================================
           CSS RESET & VARIABLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Colors matching voxEx.html UI */
            --bg-primary: #1a1a1a;
            --bg-secondary: #141414;
            --bg-tertiary: #222;
            --bg-input: #222;
            --border-color: #444;
            --border-hover: #666;
            --accent: #4caf50;
            --accent-hover: #5cbf60;
            --accent-dark: #388e3c;
            --danger: #f44;
            --danger-hover: #f55;
            --warning: #ff0;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --text-muted: #666;
            --text-value: #ff0;
        }

        /* Shared VoxEx Tool Navigation */
        .voxex-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            background: rgba(20, 20, 20, 0.98);
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .voxex-nav-back {
            padding: 5px 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ccc;
            text-decoration: none;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .voxex-nav-back:hover {
            background: #333;
            border-color: #4caf50;
            color: #fff;
        }
        .voxex-nav-sep {
            width: 1px;
            height: 20px;
            background: #333;
            margin: 0 8px;
        }
        .voxex-nav-link {
            padding: 5px 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .voxex-nav-link:hover {
            background: rgba(76, 175, 80, 0.15);
            border-color: #4caf50;
            color: #4caf50;
        }
        .voxex-nav-link.active {
            background: rgba(76, 175, 80, 0.15);
            border-color: #4caf50;
            color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        /* ============================================
           MAIN LAYOUT
           ============================================ */
        .app-container {
            display: grid;
            grid-template-rows: auto auto auto 1fr;
            height: 100vh;
        }

        /* Boot / seam-failure banner (CCR-WORLDGEN-UI-001 #7): hidden unless the
           ?test=1 seam fails to boot or is missing the GEN_PARAM exports this tool
           needs. Modeled on tools/terrain-visualizer.html's #banner. */
        #boot-banner {
            display: none;
            background: #3a1f1f;
            border-bottom: 1px solid #a44;
            color: #fdd;
            padding: 14px 20px;
            font-size: 13px;
            line-height: 1.7;
        }
        #boot-banner code {
            background: #000;
            color: #fca;
            padding: 1px 5px;
            border-radius: 3px;
        }
        /* While booted-failed, hide the (non-functional) three-panel workspace but
           keep nav/header/banner visible so the failure is diagnosable in place. */
        body.boot-failed .main-content {
            display: none;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            text-shadow: 1px 1px 0 #000;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        /* Main Content - Three Columns */
        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            overflow: hidden;
        }

        /* ============================================
           BUTTON STYLES (matching voxEx.html)
           ============================================ */
        button {
            padding: 8px 16px;
            border: 1px solid var(--border-hover);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s;
            background: #333;
            color: var(--text-primary);
        }

        button:hover {
            background: #444;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-secondary {
            background: #333;
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #444;
        }

        .btn-danger {
            background: #522;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: #633;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        /* ============================================
           PARAMETERS PANEL (LEFT)
           ============================================ */
        .params-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 15px;
        }

        .param-section {
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--border-color);
        }

        .section-header:hover {
            background: rgba(76, 175, 80, 0.1);
        }

        .section-title {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 600;
        }

        .collapse-icon {
            color: var(--text-secondary);
            transition: transform 0.2s;
            font-size: 0.8rem;
        }

        .param-section.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .param-section.collapsed .section-content {
            display: none;
        }

        .section-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Free-form gen-param controls (CCR-WORLDGEN-UI-001): no sliders, no clamping. */
        .genparam-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            align-items: center;
            gap: 8px;
        }

        .genparam-row label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .genparam-row input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-input);
            border: 1px solid #555;
            border-radius: 3px;
            color: var(--text-value);
            font-family: monospace;
            font-size: 0.85rem;
            text-align: right;
        }

        .genparam-row input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Soft amber "outside tested range" warning (CCR-WORLDGEN-UI-001) - never a clamp,
           informational only. */
        .genparam-warn {
            border-color: #d69a2d !important;
            color: #ffcf7a !important;
        }

        .genparam-toggle-row {
            margin-top: 2px;
        }

        .param-row-full {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .param-row-full label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .param-row-full input[type="text"] {
            width: 100%;
            padding: 8px;
            background: var(--bg-input);
            border: 1px solid #555;
            border-radius: 3px;
            color: var(--text-value);
            font-family: monospace;
            font-size: 0.9rem;
            text-align: left;
        }

        .seed-row {
            display: flex;
            gap: 8px;
        }

        .seed-row input {
            flex: 1;
        }

        .seed-numeric-readout {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* Checkbox styling */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-row label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* Biome picker grid (owner decision Q3: visual parity with create-world's
           #biome-selector button grid). */
        .biome-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .biome-btn {
            padding: 6px 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #ccc;
            font-size: 0.78rem;
            cursor: pointer;
        }

        .biome-btn:hover {
            border-color: var(--accent);
            color: #fff;
        }

        .biome-btn.selected {
            background: rgba(76, 175, 80, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ============================================
           PREVIEW PANEL (CENTER)
           ============================================ */
        .preview-panel {
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .preview-modes {
            display: flex;
            gap: 5px;
        }

        .preview-modes button {
            padding: 6px 14px;
            background: #333;
            border: 1px solid var(--border-color);
            color: #aaa;
        }

        .preview-modes button:hover {
            background: #444;
            color: #fff;
        }

        .preview-modes button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 500;
        }

        .preview-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .preview-controls label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .preview-controls select {
            padding: 6px 10px;
            background: #222;
            border: 1px solid #555;
            border-radius: 3px;
            color: var(--text-value);
            font-family: monospace;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #0f0f1a;
        }

        #preview-canvas {
            cursor: grab;
            image-rendering: pixelated;
        }

        #preview-canvas:active {
            cursor: grabbing;
        }

        .preview-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #fff;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }

        .preview-info span {
            margin-right: 15px;
        }

        .preview-info .label {
            color: #888;
        }

        .cursor-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #fff;
            font-family: monospace;
            min-width: 180px;
            border: 1px solid var(--border-color);
        }

        .cursor-info .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .cursor-info .info-row:last-child {
            margin-bottom: 0;
        }

        .cursor-info .label {
            color: #888;
        }

        .cursor-info .value {
            color: var(--text-value);
        }

        .zoom-controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .zoom-controls button {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
        }

        .zoom-controls button:hover {
            background: rgba(76, 175, 80, 0.3);
            color: #fff;
        }

        /* ============================================
           PRESETS PANEL (RIGHT)
           ============================================ */
        .presets-panel {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .presets-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .presets-header h2 {
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .presets-actions {
            display: flex;
            gap: 8px;
        }

        .presets-actions button {
            flex: 1;
        }

        .presets-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .preset-name {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .preset-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .preset-actions {
            display: flex;
            gap: 5px;
        }

        .preset-actions button {
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        /* Export Section */
        .export-section {
            border-top: 1px solid var(--border-color);
            padding: 15px;
        }

        .export-section h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .export-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .import-note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-height: 1.2em;
        }

        .json-preview {
            margin-top: 10px;
        }

        .json-preview textarea {
            width: 100%;
            height: 150px;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            resize: vertical;
        }

        /* ============================================
           LOADING OVERLAY
           ============================================ */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
            backdrop-filter: blur(2px);
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           TOOLTIP
           ============================================ */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-primary);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .tooltip:hover::after {
            opacity: 1;
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-input);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* ============================================
           LAYER TOGGLES (now just the Heightmap "pre-carve" checkbox row - the old
           Combined-mode terrain/biomes/rivers factor toggles were removed with the
           preview redesign, CCR-WORLDGEN-TUNABLES-001 #6)
           ============================================ */
        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .layer-toggle input {
            accent-color: var(--accent);
        }

        /* ============================================
           ADVANCED TUNABLES (CCR-WORLDGEN-TUNABLES-001 Phase B)
           ============================================ */
        .tunables-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px 6px;
            margin-top: 6px;
            border-top: 2px solid var(--accent-dark);
        }

        .tunables-header h2 {
            font-size: 1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tunables-missing-banner {
            background: #3a1f1f;
            border: 1px solid #a44;
            color: #fdd;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .tunables-missing-banner code {
            background: #000;
            color: #fca;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .tunable-note-text {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .tunable-row-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 4px;
        }

        .tunable-json-row label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .tunable-json-textarea {
            width: 100%;
            min-height: 90px;
            background: #111;
            border: 1px solid #555;
            border-radius: 4px;
            color: #9fe89f;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 6px;
            resize: vertical;
        }

        .tunable-json-error {
            font-size: 0.72rem;
            color: var(--danger);
            min-height: 1.1em;
        }

        .section-dirty-marker {
            color: var(--warning);
            font-weight: 700;
            margin-left: 4px;
        }

        .tunables-export-note {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.5;
            padding: 8px 0 0;
        }

        .precarve-toggle {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Tool Navigation -->
        <nav class="voxex-nav">
            <a href="../index.html" class="voxex-nav-back">&larr; Main</a>
            <span class="voxex-nav-sep"></span>
            <a href="voxelEditor.html" class="voxex-nav-link">Model Editor</a>
            <a href="terrain-parameter-editor.html" class="voxex-nav-link active">Terrain</a>
            <a href="KeyFrame_editor.html" class="voxex-nav-link">Animation</a>
            <a href="voxex-sound-formula.html" class="voxex-nav-link">Sound</a>
            <a href="docs-viewer.html" class="voxex-nav-link">Docs</a>
        </nav>

        <!-- Seam / localhost failure banner (hidden unless bootVoxEx() fails) -->
        <div id="boot-banner"></div>

        <!-- Header -->
        <header class="header">
            <h1>VoxEx Terrain Parameter Editor</h1>
            <div class="header-buttons">
                <button class="btn-secondary" id="btn-randomize-all" type="button">Randomize Seed</button>
                <button class="btn-secondary" id="btn-reset-all" type="button">Reset to Defaults</button>
                <button class="btn-primary" id="btn-undo" type="button" disabled>Undo</button>
                <button class="btn-primary" id="btn-redo" type="button" disabled>Redo</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Parameters Panel (Left) -->
            <aside class="params-panel" id="params-panel">
                <!-- Sections generated by JavaScript from window.VoxEx.GEN_PARAM_SCHEMA -->
            </aside>

            <!-- Preview Panel (Center) -->
            <section class="preview-panel">
                <div class="preview-toolbar">
                    <div class="preview-modes">
                        <button class="active" data-mode="heightmap" type="button">Heightmap</button>
                        <button data-mode="biome" type="button">Biomes</button>
                        <button data-mode="map" type="button">Map</button>
                        <button data-mode="combined" type="button">Combined</button>
                    </div>
                    <div class="preview-controls">
                        <div class="precarve-toggle" id="precarve-toggle" style="display: none;">
                            <label class="layer-toggle">
                                <input type="checkbox" id="heightmap-precarve">
                                Base surface (pre-carve)
                            </label>
                        </div>
                        <label>Quality:</label>
                        <select id="preview-quality">
                            <option value="256">Low (256px)</option>
                            <option value="512" selected>Medium (512px)</option>
                            <option value="1024">High (1024px)</option>
                        </select>
                    </div>
                </div>
                <div class="preview-container">
                    <canvas id="preview-canvas" width="512" height="512"></canvas>
                    <div class="cursor-info" id="cursor-info">
                        <div class="info-row">
                            <span class="label">Position:</span>
                            <span class="value" id="cursor-pos">X: 0, Z: 0</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Height (carved):</span>
                            <span class="value" id="cursor-height">--</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Pre-carve:</span>
                            <span class="value" id="cursor-height-precarve">--</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Biome:</span>
                            <span class="value" id="cursor-biome">--</span>
                        </div>
                    </div>
                    <div class="preview-info">
                        <span><span class="label">Offset:</span> <span id="view-offset">0, 0</span></span>
                        <span><span class="label">Zoom:</span> <span id="view-zoom">1.0x</span></span>
                    </div>
                    <div class="zoom-controls">
                        <button id="zoom-in" class="tooltip" data-tooltip="Zoom In" type="button">+</button>
                        <button id="zoom-out" class="tooltip" data-tooltip="Zoom Out" type="button">-</button>
                        <button id="zoom-reset" class="tooltip" data-tooltip="Reset View" type="button">R</button>
                    </div>
                    <div class="loading-overlay" id="loading-overlay">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </section>

            <!-- Presets Panel (Right) -->
            <aside class="presets-panel">
                <div class="presets-header">
                    <h2>Presets</h2>
                    <div class="presets-actions">
                        <button class="btn-primary btn-small" id="btn-save-preset" type="button">Save Preset</button>
                    </div>
                </div>
                <div class="presets-list" id="presets-list">
                    <!-- Built-in VoxEx.WORLD_PRESETS rows + user localStorage presets, generated by JS -->
                </div>
                <div class="export-section">
                    <h3>Export / Import</h3>
                    <div class="export-actions">
                        <button class="btn-secondary" id="btn-export-json" type="button">Export JSON</button>
                        <button class="btn-secondary" id="btn-copy-json" type="button">Copy to Clipboard</button>
                        <button class="btn-secondary" id="btn-copy-voxex" type="button">Copy for VoxEx</button>
                        <button class="btn-secondary" id="btn-import-json" type="button">Import JSON File</button>
                        <button class="btn-secondary" id="btn-import-paste" type="button">Paste JSON</button>
                        <input type="file" id="import-file" accept=".json" style="display: none;">
                    </div>
                    <div class="import-note" id="import-note"></div>
                    <div class="tunables-export-note">Exports (incl. tunables) import directly into the
                        game's Create New World page.</div>
                    <div class="json-preview">
                        <textarea id="json-preview" readonly></textarea>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Hidden host: boots the real game with its ?test=1 seam so this tool routes ALL
         terrain/biome/gen-param sampling through window.VoxEx. No hand-copied duplicates
         (CCR-WORLDGEN-UI-001 #7 - model is tools/terrain-visualizer.html). -->
    <iframe id="game-frame" src="../voxEx.html?test=1" style="display:none" title="hidden voxEx host (terrain functions)"></iframe>

    <script>
    'use strict';

    // ============================================================
    // CCR-WORLDGEN-UI-001 Phase B: this tool is a seam-delegating client of the
    // live game. It holds NO terrain/noise/biome math of its own - every height,
    // biome, river, and gen-param computation is delegated to voxEx.html via the
    // hidden ?test=1 iframe (window.VoxEx). If a preview mode can't be built from
    // seam exports it is dropped rather than approximated (see the removed "Caves"
    // mode - cave carving lives inline in generateTerrainPass with no per-point
    // seam hook; a follow-up CCR may add one).
    //
    // CCR-WORLDGEN-TUNABLES-001 Phases B+C: adds the "Advanced Tunables" panel (built
    // from VX.GEN_TUNABLE_SCHEMA, writing through VX.applyGenTunables/resetGenTunables)
    // and rebuilds all four preview views around the FINAL CARVED height
    // (VX.blendedHeight) instead of the pre-carve VX.terrainSurface, adding a new "Map"
    // view. The GEN_TUNABLES seam exports are checked SEPARATELY and NON-FATALLY from the
    // GEN_PARAM ones above - if missing (e.g. a voxEx.html build mid-flight on this same
    // CCR), the Advanced Tunables panel alone degrades to a banner; gen params, presets,
    // and all four preview views keep working. See computeTunablesAvailable().
    // ============================================================

    // ------------------------------------------------------------
    // CONSTANTS
    // ------------------------------------------------------------

    /** Max time to wait for the hidden iframe's window.VoxEx seam to appear. */
    const GAME_FRAME_TIMEOUT_MS = 15000;
    /** localStorage key for this tool's user-saved presets (full genParams objects). */
    const PRESET_STORAGE_KEY = 'voxex_genparam_editor_presets';
    /** localStorage key for this tool's autosave (seed string + genParams object). */
    const AUTOSAVE_STORAGE_KEY = 'voxex_genparam_editor_autosave';
    /** Starred seam exports this tool needs beyond the pre-existing terrain/noise API
     *  (added by CCR-WORLDGEN-UI-001 changes #1/#5). Checked at boot; if any are
     *  missing, a diagnosable banner is shown instead of crashing. */
    const REQUIRED_GENPARAM_EXPORTS = [
        'GEN_PARAM_SCHEMA', 'GEN_PARAM_SCHEMA_BY_KEY', 'DEFAULT_GEN_PARAMS',
        'WORLD_PRESETS', 'applyGenParams', 'parseGenParamInput', 'formatGenParam'
    ];
    /** Starred seam exports the Advanced Tunables panel needs (CCR-WORLDGEN-TUNABLES-001
     *  changes #1-#4). Checked SEPARATELY from REQUIRED_GENPARAM_EXPORTS and non-fatally:
     *  if missing (e.g. a parallel in-flight rebuild of voxEx.html), the rest of the editor
     *  - gen params, presets, all four preview views - keeps working; only the Advanced
     *  Tunables panel is replaced with a banner. See computeTunablesAvailable(). */
    const REQUIRED_TUNABLE_EXPORTS = [
        'GEN_TUNABLES', 'GEN_TUNABLE_DEFAULTS', 'GEN_TUNABLE_SCHEMA', 'applyGenTunables', 'resetGenTunables'
    ];
    /** Presentation-only biome name -> hex color table (mirrors terrain-visualizer.html). */
    const BIOME_COLOR_HEX = {
        plains: '#7cb342', hills: '#9ccc65', forests: '#2E7D32', mountains: '#78909c',
        mountain_foothills: '#8d6e63', swamp: '#5d4037', longwoods: '#1B5E20'
    };
    /** Presentation-only biome name -> emoji table (mirrors voxEx.html's populateBiomeSelector). */
    const BIOME_EMOJI = {
        plains: '🌾', hills: '⛰️', forests: '🌲',
        mountains: '🏔️', swamp: '🌿', longwoods: '🌳'
    };

    // ------------------------------------------------------------
    // MUTABLE STATE
    // ------------------------------------------------------------

    /** @type {object|null} The live game's ?test=1 seam (window.VoxEx). Null until boot. */
    let VX = null;
    /** @type {string} World seed string. NOT part of genParams (DEFAULT_GEN_PARAMS has no
     *  seed key) - fed to the live game separately via VX.seedNoise(). */
    let currentSeedStr = 'VoxEx';
    /** @type {Object<string, *>|null} The single, ALWAYS-COMPLETE gen-params object. Every
     *  edit mutates this in place or reassigns it wholesale; every apply passes the WHOLE
     *  object to VX.applyGenParams (partial objects would silently reset omitted keys -
     *  CCR-WORLDGEN-UI-001 AUDIT FLAG). */
    let currentParams = null;
    /** @type {PreviewRenderer|null} */
    let renderer = null;
    /** @type {HistoryManager|null} */
    let history = null;
    /** @type {Object<string, object>} User-saved presets (name -> full genParams object), persisted to localStorage. */
    let userPresets = {};
    /** @type {Object<string, {input: HTMLInputElement, entry: object}>} Built number-row controls, keyed by schema key. */
    const numberRowControls = {};
    /** @type {Object<string, {input: HTMLInputElement, entry: object}>} Built toggle-row controls, keyed by schema key. */
    const toggleRowControls = {};
    /** @type {Object<string, HTMLElement>} Row wrapper elements keyed by schema key, for showIf visibility toggling. */
    const rowWrappers = {};
    /** @type {HTMLElement|null} The biome-picker button grid container, once built. */
    let biomeGridEl = null;
    /** @type {boolean} Whether the live seam exposes ALL GEN_TUNABLES exports (Phase B/C).
     *  When false, the Advanced Tunables panel is replaced with a banner and every
     *  tunables-touching code path (autosave/export/history) treats tunables as absent
     *  rather than crashing. Recomputed once at boot in onVoxExReady(). */
    let tunablesAvailable = false;
    /** @type {Object<string, *>|null} Deep-copy MIRROR of VX.GEN_TUNABLES, refreshed after
     *  every tunable change via syncCurrentTunablesMirror(). Read-only snapshot used for
     *  autosave/export/dirty-marking - the live VX.GEN_TUNABLES registry stays the single
     *  source of truth for rendering. */
    let currentTunables = null;
    /** @type {Object<string, *>|null} Tunables delta restored from localStorage autosave,
     *  applied via a single VX.applyGenTunables() call once the seam is ready (CCR
     *  requirement: "on boot, after seeding, apply saved tunables via one applyGenTunables
     *  call"). Null once consumed. */
    let pendingTunablesAutosave = null;
    /** @type {Object<string, {input: HTMLInputElement, entry: object}>} Built tunable
     *  number-row controls, keyed by schema key. */
    const tunableNumberControls = {};
    /** @type {Object<string, {textarea: HTMLTextAreaElement, errorEl: HTMLElement, entry: object}>}
     *  Built tunable JSON-row controls (splines/AXIS_W/BIOME_PARAMS), keyed by schema key. */
    const tunableJsonControls = {};
    /** @type {Map<string, Array<object>>} Tunable schema entries grouped by `section`,
     *  rebuilt each time the Advanced Tunables panel is (re)built. */
    let tunableSectionsBySection = new Map();
    /** @type {Object<string, HTMLElement>} Section name -> dirty-marker element, for the
     *  "differs from defaults" dial-in aid on each Advanced Tunables section header. */
    const tunableSectionDirtyMarkers = {};

    // ------------------------------------------------------------
    // SEAM BOOTSTRAP
    // ------------------------------------------------------------

    /**
     * Poll the hidden game iframe until its window.VoxEx seam exists (with the core
     * terrain functions this tool needs), then check for the newer GEN_PARAM exports
     * and either boot the app or show a diagnosable failure banner.
     * @returns {void}
     */
    function bootVoxEx() {
        if (location.protocol === 'file:') {
            showBanner(localhostBannerHtml());
            return;
        }
        const frame = document.getElementById('game-frame');
        const start = performance.now();
        (function poll() {
            let seam = null;
            try { seam = frame.contentWindow && frame.contentWindow.VoxEx; } catch (e) { seam = null; }
            if (seam && typeof seam.seedNoise === 'function' && typeof seam.terrainSurface === 'function'
                && typeof seam.computeSurfaceHeight === 'function' && typeof seam.resolveBiome === 'function'
                && typeof seam.getRiverFactor === 'function' && typeof seam.getOceanFactor === 'function'
                && typeof seam.blendedHeight === 'function') {
                VX = seam;
                const missing = getMissingGenParamExports(VX);
                if (missing.length > 0) {
                    showBanner(seamMissingBannerHtml(missing));
                    return;
                }
                onVoxExReady();
                return;
            }
            if (performance.now() - start > GAME_FRAME_TIMEOUT_MS) {
                showBanner(localhostBannerHtml());
                return;
            }
            setTimeout(poll, 80);
        })();
    }

    /**
     * Check which of the starred GEN_PARAM seam exports (CCR-WORLDGEN-UI-001 changes
     * #1/#5) are absent on the live seam.
     * @param {object} seam - window.VoxEx from the hidden iframe.
     * @returns {string[]} Names of missing exports (empty if all present).
     */
    function getMissingGenParamExports(seam) {
        return REQUIRED_GENPARAM_EXPORTS.filter((name) => seam[name] === undefined);
    }

    /**
     * Check which of the starred GEN_TUNABLES seam exports (CCR-WORLDGEN-TUNABLES-001
     * changes #1-#4) are absent on the live seam. Unlike getMissingGenParamExports, a
     * non-empty result here does NOT fail the whole boot - see computeTunablesAvailable().
     * @param {object} seam - window.VoxEx from the hidden iframe.
     * @returns {string[]} Names of missing exports (empty if all present).
     */
    function getMissingTunableExports(seam) {
        return REQUIRED_TUNABLE_EXPORTS.filter((name) => seam[name] === undefined);
    }

    /**
     * Determine whether the Advanced Tunables panel can be built against the live seam.
     * @returns {boolean} True if every REQUIRED_TUNABLE_EXPORTS name is present on VX.
     */
    function computeTunablesAvailable() {
        return !!VX && getMissingTunableExports(VX).length === 0;
    }

    /**
     * Banner HTML for the non-fatal case where GEN_TUNABLES seam exports are missing.
     * @returns {string} Banner HTML shown INSIDE the Advanced Tunables area only.
     */
    function tunablesMissingBannerHtml() {
        const missing = VX ? getMissingTunableExports(VX) : REQUIRED_TUNABLE_EXPORTS;
        return '<b>voxEx.html is missing the GEN_TUNABLES seam exports &mdash; rebuild required.</b><br>' +
            'The Advanced Tunables panel needs these <code>window.VoxEx</code> exports from ' +
            'CCR-WORLDGEN-TUNABLES-001 (changes #1-#4): <code>' + missing.join(', ') + '</code>. ' +
            'Rebuild/update <code>voxEx.html</code> so the <code>?test=1</code> seam includes them, then reload ' +
            'this page. The rest of the editor (gen params, presets, all four preview views) works normally.';
    }

    /**
     * Message for the file:// / iframe-timeout failure case.
     * @returns {string} Banner HTML.
     */
    function localhostBannerHtml() {
        return '<b>Terrain functions unavailable.</b><br>' +
            'This tool loads <code>voxEx.html</code> in a hidden iframe via its <code>?test=1</code> seam. ' +
            'Serve the repo over <b>localhost</b> (like <code>tools/voxex-tests.html</code>) and open this page via ' +
            '<code>http://localhost/&hellip;</code>. Opening the file directly with <code>file://</code> will not work ' +
            '(browsers block the iframe&rsquo;s scripts / cross-frame access).';
    }

    /**
     * Message for the seam-present-but-incomplete case (voxEx.html predates
     * CCR-WORLDGEN-UI-001's GEN_PARAM seam exports).
     * @param {string[]} missing - Names of missing window.VoxEx exports.
     * @returns {string} Banner HTML.
     */
    function seamMissingBannerHtml(missing) {
        return '<b>voxEx.html is missing the GEN_PARAM seam exports &mdash; rebuild required.</b><br>' +
            'This tool needs these <code>window.VoxEx</code> exports from CCR-WORLDGEN-UI-001 (changes #1/#5): ' +
            '<code>' + missing.join(', ') + '</code>. Rebuild/update <code>voxEx.html</code> so the ' +
            '<code>?test=1</code> seam includes them, then reload this page.';
    }

    /**
     * Show the failure banner and hide the (non-functional) three-panel workspace.
     * @param {string} html - Banner inner HTML.
     * @returns {void}
     */
    function showBanner(html) {
        const banner = document.getElementById('boot-banner');
        banner.innerHTML = html;
        banner.style.display = 'block';
        document.body.classList.add('boot-failed');
    }

    /**
     * Called once the VoxEx seam (with all GEN_PARAM exports) is confirmed available:
     * initialize state, build the UI, and render the first preview.
     * @returns {void}
     */
    function onVoxExReady() {
        currentSeedStr = 'VoxEx';
        currentParams = Object.assign({}, VX.DEFAULT_GEN_PARAMS);
        loadAutoSave(); // may override currentSeedStr / currentParams / pendingTunablesAutosave

        if (typeof VX.seedNoise === 'function') VX.seedNoise(currentSeedStr);

        tunablesAvailable = computeTunablesAvailable();
        if (tunablesAvailable && pendingTunablesAutosave && Object.keys(pendingTunablesAutosave).length > 0) {
            VX.applyGenTunables(pendingTunablesAutosave);
        }
        pendingTunablesAutosave = null;

        renderer = new PreviewRenderer(document.getElementById('preview-canvas'));

        buildParamsPanel(); // also builds the Advanced Tunables area (or its banner)
        document.getElementById('seed-input').value = currentSeedStr;
        updateSeedNumericReadout();

        setupEventListeners();

        userPresets = loadUserPresets();
        updatePresetsUI();

        syncCurrentTunablesMirror();

        history = new HistoryManager();
        pushHistorySnapshot();

        commitParamsChange(false); // apply + render without double-pushing history
    }

    // ------------------------------------------------------------
    // UI HELPERS (collapsible sections)
    // ------------------------------------------------------------

    /**
     * Create a collapsible parameter section shell.
     * @param {string} title - Section title.
     * @param {boolean} [collapsed=true] - Initial collapsed state. Every schema-driven
     *   section starts collapsed (CCR-WORLDGEN-UI-001 #8); the Seed section is built
     *   with collapsed=false since it's the entry point.
     * @returns {HTMLElement} The section element (append rows to `.section-content`).
     */
    function createSection(title, collapsed = true) {
        const section = document.createElement('div');
        section.className = 'param-section' + (collapsed ? ' collapsed' : '');
        section.innerHTML =
            '<div class="section-header">' +
            '<span class="section-title"></span>' +
            '<span class="collapse-icon">&#9660;</span>' +
            '</div>' +
            '<div class="section-content"></div>';
        section.querySelector('.section-title').textContent = title;
        section.querySelector('.section-header').addEventListener('click', () => {
            section.classList.toggle('collapsed');
        });
        return section;
    }

    // ------------------------------------------------------------
    // COLOR UTILITIES
    // ------------------------------------------------------------

    /**
     * Convert a hex color string to an RGB object.
     * @param {string} hex - Hex color string (e.g. "#7cb342").
     * @returns {{r: number, g: number, b: number}} RGB object (0-255).
     */
    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 255, g: 0, b: 255 };
    }

    /**
     * Look up a presentation color for a biome name, falling back to a deterministic
     * hashed color for any biome not in BIOME_COLOR_HEX (defensive - BIOME_CONFIG is
     * live data from the seam, not hand-enumerated here).
     * @param {string} name - Biome name (resolveBiome(...).name).
     * @returns {{r: number, g: number, b: number}} RGB color.
     */
    function getBiomeColorRgb(name) {
        const hex = BIOME_COLOR_HEX[name];
        if (hex) return hexToRgb(hex);
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
        return { r: 60 + (hash & 0x7f), g: 60 + ((hash >>> 7) & 0x7f), b: 60 + ((hash >>> 14) & 0x7f) };
    }

    /** Hypsometric ramp control points (t in [0,1] of the in-view height range) for the
     *  Heightmap preview (CCR-WORLDGEN-TUNABLES-001 #6). Purely elevation-driven. */
    const HYPSOMETRIC_STOPS = [
        { t: 0.0, r: 15, g: 15, b: 90 },     // deep blue
        { t: 0.2, r: 30, g: 150, b: 190 },   // cyan
        { t: 0.4, r: 60, g: 150, b: 60 },    // green
        { t: 0.6, r: 195, g: 175, b: 115 },  // tan
        { t: 0.8, r: 120, g: 80, b: 50 },    // brown
        { t: 1.0, r: 255, g: 255, b: 255 }   // white
    ];
    /** Map view: light biome-tint blend weight over the elevation-based land base color. */
    const MAP_BIOME_TINT_STRENGTH = 0.28;
    /** Combined view: STRONGER biome-tint blend weight (owner decision - Map + heavier tint). */
    const COMBINED_BIOME_TINT_STRENGTH = 0.62;
    /** Approximate treeline Y - land at/above this height renders as snow in Map/Combined
     *  (DOCUMENTED APPROXIMATION - tune visually; the real material cascade is inline in
     *  generateTerrainPass, not on the seam). */
    const TREELINE_Y = 130;
    /** Beach sand renders on near-water land within this many blocks above sea level. */
    const BEACH_SAND_ABOVE_WATER = 2;
    /** Cheap fixed-offset "near water" proxy (pixel deltas, NOT world-unit-scaled - a
     *  documented approximation so isNearWater() stays O(1) per pixel instead of a radius
     *  scan). */
    const NEAR_WATER_PIXEL_OFFSETS = [
        [-3, 0], [3, 0], [0, -3], [0, 3], [-2, -2], [2, -2], [-2, 2], [2, 2]
    ];
    /** NW-high light direction for hillshade (same vector as tools/terrain-probe.mjs's
     *  `hillshade` command, for a consistent look between the two tools). */
    const HILLSHADE_LIGHT = { x: -0.55, y: 0.62, z: -0.55 };

    /**
     * Hypsometric color ramp (deep blue -> cyan -> green -> tan -> brown -> white) for the
     * Heightmap preview. Purely elevation-driven - NOT tied to sea level (Heightmap draws
     * no water; see PreviewRenderer#renderHeightmap).
     * @param {number} h - Height value.
     * @param {number} minH - Minimum height in view.
     * @param {number} maxH - Maximum height in view.
     * @returns {{r: number, g: number, b: number}} RGB color.
     */
    function getHypsometricColor(h, minH, maxH) {
        const range = Math.max(maxH - minH, 1);
        const t = Math.max(0, Math.min(1, (h - minH) / range));
        for (let i = 0; i < HYPSOMETRIC_STOPS.length - 1; i++) {
            const a = HYPSOMETRIC_STOPS[i], b = HYPSOMETRIC_STOPS[i + 1];
            if (t >= a.t && t <= b.t) {
                const lt = (t - a.t) / Math.max(b.t - a.t, 1e-6);
                return {
                    r: a.r + (b.r - a.r) * lt,
                    g: a.g + (b.g - a.g) * lt,
                    b: a.b + (b.b - a.b) * lt
                };
            }
        }
        return { r: 255, g: 255, b: 255 };
    }

    /**
     * Cheap "is this land pixel near water" proxy for Map/Combined's beach-sand rule:
     * checks a small fixed ring of pixel offsets in the ALREADY-SAMPLED height grid (no
     * extra blendedHeight calls) rather than a true world-distance flood search - a
     * documented approximation, same spirit as the rest of the Map view's material cascade.
     * @param {Float32Array} heights - Precomputed carved-height grid (row-major, width*height).
     * @param {number} width - Grid width.
     * @param {number} height - Grid height.
     * @param {number} px - Pixel X.
     * @param {number} py - Pixel Y.
     * @param {number} seaLevel - Sea level.
     * @returns {boolean} True if any nearby sampled pixel is underwater.
     */
    function isNearWater(heights, width, height, px, py, seaLevel) {
        for (let k = 0; k < NEAR_WATER_PIXEL_OFFSETS.length; k++) {
            const nx = px + NEAR_WATER_PIXEL_OFFSETS[k][0];
            const ny = py + NEAR_WATER_PIXEL_OFFSETS[k][1];
            if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;
            if (heights[ny * width + nx] < seaLevel) return true;
        }
        return false;
    }

    /**
     * Central-difference NW-light hillshade multiplier for the Map/Combined views (same
     * technique as tools/terrain-probe.mjs's `hillshade` command: a Lambertian shade from a
     * surface normal built out of the height grid's local slope).
     * @param {Float32Array} heights - Precomputed carved-height grid (row-major, width*height).
     * @param {number} width - Grid width.
     * @param {number} height - Grid height.
     * @param {number} px - Pixel X.
     * @param {number} py - Pixel Y.
     * @param {number} worldPerPixel - World units per pixel at the current zoom (slope needs
     *   a real distance, not a raw pixel delta, so shading reads consistently across zoom).
     * @returns {number} Brightness multiplier (clamped to a visually sane range).
     */
    function computeHillshade(heights, width, height, px, py, worldPerPixel) {
        const x0 = Math.max(px - 1, 0), x1 = Math.min(px + 1, width - 1);
        const y0 = Math.max(py - 1, 0), y1 = Math.min(py + 1, height - 1);
        const hx1 = heights[py * width + x1], hx0 = heights[py * width + x0];
        const hz1 = heights[y1 * width + px], hz0 = heights[y0 * width + px];
        const dx = Math.max((x1 - x0) * worldPerPixel, 1e-6);
        const dz = Math.max((y1 - y0) * worldPerPixel, 1e-6);
        const nx = -(hx1 - hx0) / dx;
        const nz = -(hz1 - hz0) / dz;
        const ny = 1.5;
        const inv = 1 / Math.hypot(nx, ny, nz);
        const L = HILLSHADE_LIGHT;
        const shade = (nx * inv * L.x + ny * inv * L.y + nz * inv * L.z) * 1.3;
        return Math.max(0.35, Math.min(1.5, shade));
    }

    // ------------------------------------------------------------
    // PREVIEW RENDERER
    // ------------------------------------------------------------

    /**
     * PreviewRenderer - renders Heightmap / Biomes / Map / Combined previews entirely from
     * live VX.* seam calls (no local terrain math). Also owns pan/zoom view state.
     */
    class PreviewRenderer {
        /**
         * @param {HTMLCanvasElement} canvas - The preview canvas element.
         */
        constructor(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.offsetX = 0;
            this.offsetZ = 0;
            this.zoom = 1;
            this.mode = 'heightmap';
            /** @type {boolean} Heightmap-only: true swaps the sampler to VX.terrainSurface
             *  (pre-carve base surface) instead of the default VX.blendedHeight (final
             *  carved height, CCR-WORLDGEN-TUNABLES-001 #6 / owner-resolved Q2). */
            this.showPreCarve = false;
            this.renderTimeout = null;
        }

        /**
         * Schedule a debounced render (~100ms), coalescing rapid edits/pans.
         * @returns {void}
         */
        scheduleRender() {
            if (this.renderTimeout) clearTimeout(this.renderTimeout);
            this.renderTimeout = setTimeout(() => this.render(), 100);
        }

        /**
         * Render the preview for the current mode.
         * @returns {void}
         */
        render() {
            if (!VX) return;
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('visible');
            requestAnimationFrame(() => {
                if (this.mode === 'heightmap') this.renderHeightmap();
                else if (this.mode === 'biome') this.renderBiomeMap();
                else if (this.mode === 'map') this.renderMap();
                else this.renderCombined();
                overlay.classList.remove('visible');
                this.updateViewInfo();
            });
        }

        /**
         * Render Heightmap mode: PURE elevation (no water fill) from the FINAL CARVED
         * height `VX.blendedHeight(gx, gz, VX.worldSeed)` by default - rivers/oceans show
         * up as carved valleys, fixing the pre-carve-only bug this CCR exists to close
         * (problem 2). The "Base surface (pre-carve)" checkbox (this.showPreCarve) swaps
         * the sampler to `VX.terrainSurface` for shape-tuning without carve interference.
         * Hypsometric ramp (deep blue -> cyan -> green -> tan -> brown -> white) + a thin
         * sea-level contour line; a corner caption always states which height is shown.
         * @returns {void}
         */
        renderHeightmap() {
            const width = this.canvas.width;
            const height = this.canvas.height;
            const imageData = this.ctx.createImageData(width, height);
            const data = imageData.data;
            const seaLevel = currentParams.seaLevel;
            const seed = (VX && typeof VX.worldSeed === 'number') ? VX.worldSeed : 0;
            const sampleHeight = this.showPreCarve
                ? (wx, wz) => VX.terrainSurface(wx, wz)
                : (wx, wz) => VX.blendedHeight(wx, wz, seed);

            let minH = Infinity, maxH = -Infinity;
            const heights = new Float32Array(width * height);
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const wx = (px - width / 2) / this.zoom + this.offsetX;
                    const wz = (py - height / 2) / this.zoom + this.offsetZ;
                    const h = sampleHeight(wx, wz);
                    heights[py * width + px] = h;
                    if (h < minH) minH = h;
                    if (h > maxH) maxH = h;
                }
            }

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const idx = py * width + px;
                    const h = heights[idx];
                    const color = getHypsometricColor(h, minH, maxH);
                    let r = color.r, g = color.g, b = color.b;

                    // Thin sea-level contour: a single threshold crossing (not the old
                    // multi-band contour interval), since Heightmap no longer fills water.
                    if (px > 0 && py > 0) {
                        const hLeft = heights[idx - 1];
                        const hUp = heights[idx - width];
                        const above = h >= seaLevel;
                        if (above !== (hLeft >= seaLevel) || above !== (hUp >= seaLevel)) {
                            r *= 0.35; g *= 0.35; b *= 0.35;
                        }
                    }

                    const i = idx * 4;
                    data[i] = Math.round(r);
                    data[i + 1] = Math.round(g);
                    data[i + 2] = Math.round(b);
                    data[i + 3] = 255;
                }
            }

            this.ctx.putImageData(imageData, 0, 0);
            this.drawHeightLegend(minH, maxH, seaLevel);
            this.drawCaption(this.showPreCarve
                ? 'base surface (pre-carve) — VX.terrainSurface'
                : 'final carved height — VX.blendedHeight (rivers/oceans carved in)');
        }

        /**
         * Draw the hypsometric height legend gradient bar with a sea-level marker line.
         * @param {number} minH - Minimum height in view.
         * @param {number} maxH - Maximum height in view.
         * @param {number} seaLevel - Sea level (marker only - Heightmap draws no water).
         * @returns {void}
         */
        drawHeightLegend(minH, maxH, seaLevel) {
            const ctx = this.ctx;
            const legendWidth = 20;
            const legendHeight = 150;
            const x = this.canvas.width - legendWidth - 50;
            const y = 60;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x - 5, y - 25, legendWidth + 50, legendHeight + 50);

            for (let i = 0; i < legendHeight; i++) {
                const t = 1 - i / legendHeight;
                const h = minH + t * (maxH - minH);
                const color = getHypsometricColor(h, minH, maxH);
                ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
                ctx.fillRect(x, y + i, legendWidth, 1);
            }

            ctx.strokeStyle = '#444';
            ctx.strokeRect(x, y, legendWidth, legendHeight);

            ctx.fillStyle = '#fff';
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`${Math.round(maxH)}`, x + legendWidth + 4, y + 10);
            ctx.fillText(`${Math.round(minH)}`, x + legendWidth + 4, y + legendHeight);

            if (seaLevel >= minH && seaLevel <= maxH) {
                const seaY = y + (1 - (seaLevel - minH) / (maxH - minH)) * legendHeight;
                ctx.strokeStyle = '#4cf';
                ctx.beginPath();
                ctx.moveTo(x - 3, seaY);
                ctx.lineTo(x + legendWidth + 3, seaY);
                ctx.stroke();
                ctx.fillStyle = '#4cf';
                ctx.fillText(`~${Math.round(seaLevel)}`, x + legendWidth + 4, seaY + 3);
            }

            ctx.fillStyle = '#888';
            ctx.fillText('Height', x, y - 10);
        }

        /**
         * Draw a small caption in the bottom-center of the canvas (clear of the top-left
         * cursor-info overlay, top-right height legend, and bottom-left/right DOM overlays).
         * @param {string} text - Caption text.
         * @returns {void}
         */
        drawCaption(text) {
            const ctx = this.ctx;
            ctx.save();
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            const textWidth = ctx.measureText(text).width;
            const x = this.canvas.width / 2;
            const y = this.canvas.height - 14;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x - textWidth / 2 - 8, y - 14, textWidth + 16, 20);
            ctx.fillStyle = '#ffd';
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        /**
         * Render Biomes mode: VX.resolveBiome(...).name colors, height-shaded for
         * relief readability, with the same water shading as Heightmap mode.
         * @returns {void}
         */
        renderBiomeMap() {
            const width = this.canvas.width;
            const height = this.canvas.height;
            const imageData = this.ctx.createImageData(width, height);
            const data = imageData.data;
            const seaLevel = currentParams.seaLevel;

            let minH = Infinity, maxH = -Infinity;
            const heights = new Float32Array(width * height);
            const names = new Array(width * height);
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const wx = (px - width / 2) / this.zoom + this.offsetX;
                    const wz = (py - height / 2) / this.zoom + this.offsetZ;
                    const h = VX.terrainSurface(wx, wz);
                    const biome = VX.resolveBiome(wx, wz);
                    heights[py * width + px] = h;
                    names[py * width + px] = biome ? biome.name : 'plains';
                    if (h < minH) minH = h;
                    if (h > maxH) maxH = h;
                }
            }

            const range = Math.max(maxH - minH, 10);
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const idx = py * width + px;
                    const h = heights[idx];
                    const color = getBiomeColorRgb(names[idx]);
                    const shade = 0.5 + 0.5 * ((h - minH) / range);
                    const i = idx * 4;

                    if (h < seaLevel) {
                        const waterDepth = Math.min(1, (seaLevel - h) / 20);
                        data[i] = Math.round(color.r * shade * (1 - waterDepth * 0.7) + 40 * waterDepth);
                        data[i + 1] = Math.round(color.g * shade * (1 - waterDepth * 0.5) + 80 * waterDepth);
                        data[i + 2] = Math.round(color.b * shade * (1 - waterDepth * 0.3) + 180 * waterDepth);
                    } else {
                        data[i] = Math.round(color.r * shade);
                        data[i + 1] = Math.round(color.g * shade);
                        data[i + 2] = Math.round(color.b * shade);
                    }
                    data[i + 3] = 255;
                }
            }

            this.ctx.putImageData(imageData, 0, 0);
        }

        /**
         * Render Map mode (NEW, CCR-WORLDGEN-TUNABLES-001 #6): top-down "what the world
         * looks like" from the FINAL CARVED height. Thin wrapper over renderMapCore with
         * the lighter Map biome-tint strength, plus the required honesty caption.
         * @returns {void}
         */
        renderMap() {
            this.renderMapCore(MAP_BIOME_TINT_STRENGTH);
            this.drawCaption('materials approximated — heights & water are real');
        }

        /**
         * Render Combined mode: Map + a STRONGER biome tint overlay (owner decision
         * 2026-07-11: KEEP Combined as a 4th view). Same renderMapCore pipeline as Map,
         * just a heavier tint constant - no separate factor-overlay layers remain (rivers/
         * oceans now come from the real carved height + sea level, not a factor blend).
         * @returns {void}
         */
        renderCombined() {
            this.renderMapCore(COMBINED_BIOME_TINT_STRENGTH);
            this.drawCaption('Map + stronger biome tint — materials approximated, heights & water real');
        }

        /**
         * Shared Map/Combined rendering core: carved height + biome name per pixel (single
         * grid pass, cached for the hillshade pass so it never resamples blendedHeight),
         * WATER wherever carved height < seaLevel (real data, no factor overlays), a
         * DOCUMENTED-APPROXIMATION land material cascade (beach sand near water, snow above
         * the treeline band, otherwise a biome-tinted grass/rock elevation gradient - the
         * REAL per-column material cascade lives inline in generateTerrainPass, not on the
         * seam, same honesty note terrain-visualizer.html carries), and NW-light hillshade
         * (central-difference normals, same technique as tools/terrain-probe.mjs's
         * `hillshade` command).
         * @param {number} biomeTintStrength - 0-1 blend weight of the biome color into the
         *   elevation-based land base color (Map uses a light tint, Combined a heavy one).
         * @returns {void}
         */
        renderMapCore(biomeTintStrength) {
            const width = this.canvas.width;
            const height = this.canvas.height;
            const imageData = this.ctx.createImageData(width, height);
            const data = imageData.data;
            const seaLevel = currentParams.seaLevel;
            const seed = (VX && typeof VX.worldSeed === 'number') ? VX.worldSeed : 0;
            const worldPerPixel = 1 / this.zoom;

            const heights = new Float32Array(width * height);
            const names = new Array(width * height);
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const wx = (px - width / 2) / this.zoom + this.offsetX;
                    const wz = (py - height / 2) / this.zoom + this.offsetZ;
                    heights[py * width + px] = VX.blendedHeight(wx, wz, seed);
                    const biome = VX.resolveBiome(wx, wz);
                    names[py * width + px] = biome ? biome.name : 'plains';
                }
            }

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const idx = py * width + px;
                    const h = heights[idx];
                    let r, g, b;

                    if (h < seaLevel) {
                        const depth = Math.min(1, (seaLevel - h) / 24);
                        r = 25 + (1 - depth) * 30;
                        g = 70 + (1 - depth) * 70;
                        b = 130 + (1 - depth) * 90;
                    } else {
                        const nearWater = isNearWater(heights, width, height, px, py, seaLevel);
                        if (nearWater && h < seaLevel + BEACH_SAND_ABOVE_WATER) {
                            r = 214; g = 196; b = 148; // beach sand approximation
                        } else if (h >= TREELINE_Y) {
                            r = 232; g = 236; b = 240; // snow above the treeline band
                        } else {
                            const t = Math.max(0, Math.min(1, (h - seaLevel) / 110));
                            r = 70 + t * 90; g = 130 - t * 30; b = 55 + t * 40; // grass -> dry/rock
                        }

                        const biomeColor = getBiomeColorRgb(names[idx]);
                        r = r * (1 - biomeTintStrength) + biomeColor.r * biomeTintStrength;
                        g = g * (1 - biomeTintStrength) + biomeColor.g * biomeTintStrength;
                        b = b * (1 - biomeTintStrength) + biomeColor.b * biomeTintStrength;

                        const shade = computeHillshade(heights, width, height, px, py, worldPerPixel);
                        r *= shade; g *= shade; b *= shade;
                    }

                    const i = idx * 4;
                    data[i] = Math.round(Math.max(0, Math.min(255, r)));
                    data[i + 1] = Math.round(Math.max(0, Math.min(255, g)));
                    data[i + 2] = Math.round(Math.max(0, Math.min(255, b)));
                    data[i + 3] = 255;
                }
            }

            this.ctx.putImageData(imageData, 0, 0);
        }

        /**
         * Update the view-info readout (offset / zoom).
         * @returns {void}
         */
        updateViewInfo() {
            document.getElementById('view-offset').textContent =
                `${Math.round(this.offsetX)}, ${Math.round(this.offsetZ)}`;
            document.getElementById('view-zoom').textContent = `${this.zoom.toFixed(1)}x`;
        }

        /**
         * Get seam-delegated terrain info at a pixel position (for cursor-info + click).
         * Returns BOTH the final carved height and the pre-carve base surface height side
         * by side (CCR-WORLDGEN-TUNABLES-001 #6), plus the resolved biome name.
         * @param {number} px - Pixel X.
         * @param {number} py - Pixel Y.
         * @returns {{x: number, z: number, carvedHeight: number, preCarveHeight: number, biome: string}} Column info.
         */
        getInfoAt(px, py) {
            const width = this.canvas.width;
            const height = this.canvas.height;
            const wx = (px - width / 2) / this.zoom + this.offsetX;
            const wz = (py - height / 2) / this.zoom + this.offsetZ;
            const seed = (VX && typeof VX.worldSeed === 'number') ? VX.worldSeed : 0;
            const carvedHeight = (typeof VX.blendedHeight === 'function') ? VX.blendedHeight(wx, wz, seed) : NaN;
            const preCarveHeight = VX.terrainSurface(wx, wz);
            const biome = VX.resolveBiome(wx, wz);
            return {
                x: Math.round(wx), z: Math.round(wz),
                carvedHeight, preCarveHeight,
                biome: biome ? biome.name : 'unknown'
            };
        }

        /**
         * Pan the view by a pixel delta.
         * @param {number} dx - Delta X in pixels.
         * @param {number} dy - Delta Y in pixels.
         * @returns {void}
         */
        pan(dx, dy) {
            this.offsetX -= dx / this.zoom;
            this.offsetZ -= dy / this.zoom;
            this.scheduleRender();
        }

        /**
         * Center the view directly on a world position (owner decision Q4: Spawn X/Z
         * edits pan the preview).
         * @param {number} wx - World X to center on.
         * @param {number} wz - World Z to center on.
         * @returns {void}
         */
        panTo(wx, wz) {
            this.offsetX = wx;
            this.offsetZ = wz;
            this.scheduleRender();
        }

        /**
         * Zoom the view, keeping the given pixel position fixed under the cursor.
         * @param {number} factor - Zoom factor (> 1 to zoom in).
         * @param {number} centerX - Center X in pixels.
         * @param {number} centerY - Center Y in pixels.
         * @returns {void}
         */
        zoomAt(factor, centerX, centerY) {
            const width = this.canvas.width;
            const height = this.canvas.height;
            const wxBefore = (centerX - width / 2) / this.zoom + this.offsetX;
            const wzBefore = (centerY - height / 2) / this.zoom + this.offsetZ;
            this.zoom = Math.max(0.1, Math.min(10, this.zoom * factor));
            const wxAfter = (centerX - width / 2) / this.zoom + this.offsetX;
            const wzAfter = (centerY - height / 2) / this.zoom + this.offsetZ;
            this.offsetX += wxBefore - wxAfter;
            this.offsetZ += wzBefore - wzAfter;
            this.scheduleRender();
        }

        /**
         * Reset the view to origin, zoom 1.
         * @returns {void}
         */
        resetView() {
            this.offsetX = 0;
            this.offsetZ = 0;
            this.zoom = 1;
            this.scheduleRender();
        }

        /**
         * Set the preview mode.
         * @param {string} mode - 'heightmap', 'biome', 'map', or 'combined'.
         * @returns {void}
         */
        setMode(mode) {
            this.mode = mode;
            this.scheduleRender();
        }

        /**
         * Set the canvas resolution (square).
         * @param {number} size - Canvas size in pixels.
         * @returns {void}
         */
        setSize(size) {
            this.canvas.width = size;
            this.canvas.height = size;
            this.scheduleRender();
        }

        /**
         * Heightmap-only: swap the sampler between VX.blendedHeight (final carved, default)
         * and VX.terrainSurface (pre-carve base surface).
         * @param {boolean} show - True to show the pre-carve base surface.
         * @returns {void}
         */
        setPreCarve(show) {
            this.showPreCarve = show;
            if (this.mode === 'heightmap') this.scheduleRender();
        }
    }

    // ------------------------------------------------------------
    // UNDO/REDO
    // ------------------------------------------------------------

    /**
     * HistoryManager - undo/redo over full currentParams snapshots (JSON-serialized).
     */
    class HistoryManager {
        /**
         * @param {number} [maxStates=20] - Maximum retained snapshots.
         */
        constructor(maxStates = 20) {
            this.states = [];
            this.currentIndex = -1;
            this.maxStates = maxStates;
            this.isRestoring = false;
        }

        /**
         * Push a new params snapshot.
         * @param {object} state - The genParams object to snapshot.
         * @returns {void}
         */
        push(state) {
            if (this.isRestoring) return;
            this.states = this.states.slice(0, this.currentIndex + 1);
            this.states.push(JSON.stringify(state));
            if (this.states.length > this.maxStates) this.states.shift();
            this.currentIndex = this.states.length - 1;
            this.updateButtons();
        }

        /**
         * Move to and return the previous snapshot.
         * @returns {object|null} Previous state or null if none.
         */
        undo() {
            if (this.currentIndex <= 0) return null;
            this.currentIndex--;
            this.updateButtons();
            return JSON.parse(this.states[this.currentIndex]);
        }

        /**
         * Move to and return the next snapshot.
         * @returns {object|null} Next state or null if none.
         */
        redo() {
            if (this.currentIndex >= this.states.length - 1) return null;
            this.currentIndex++;
            this.updateButtons();
            return JSON.parse(this.states[this.currentIndex]);
        }

        /** @returns {boolean} Whether undo is available. */
        canUndo() { return this.currentIndex > 0; }
        /** @returns {boolean} Whether redo is available. */
        canRedo() { return this.currentIndex < this.states.length - 1; }

        /**
         * Sync the Undo/Redo button disabled state.
         * @returns {void}
         */
        updateButtons() {
            document.getElementById('btn-undo').disabled = !this.canUndo();
            document.getElementById('btn-redo').disabled = !this.canRedo();
        }
    }

    // ------------------------------------------------------------
    // PARAMS PANEL (built from VX.GEN_PARAM_SCHEMA)
    // ------------------------------------------------------------

    /**
     * Build the left params panel: a manual Seed section (open by default - it's the
     * entry point, CCR-WORLDGEN-UI-001 #8) followed by one collapsed section per
     * distinct VX.GEN_PARAM_SCHEMA `section` value, in schema order.
     * @returns {void}
     */
    function buildParamsPanel() {
        const panel = document.getElementById('params-panel');
        panel.innerHTML = '';
        panel.appendChild(buildSeedSection());

        const bySection = groupSchemaBySections(VX.GEN_PARAM_SCHEMA);
        for (const [sectionName, entries] of bySection) {
            panel.appendChild(buildSchemaSection(sectionName, entries));
        }

        buildAdvancedTunablesArea();
    }

    /**
     * Group schema entries by their `section` field, preserving first-seen order.
     * @param {Array<object>} schema - VX.GEN_PARAM_SCHEMA.
     * @returns {Map<string, Array<object>>} Section name -> entries in that section.
     */
    function groupSchemaBySections(schema) {
        const map = new Map();
        for (const entry of schema) {
            if (!map.has(entry.section)) map.set(entry.section, []);
            map.get(entry.section).push(entry);
        }
        return map;
    }

    /**
     * Build the manual Seed section (not part of GEN_PARAM_SCHEMA - the world seed
     * is a separate concept from genParams, fed to the game via VX.seedNoise()).
     * @returns {HTMLElement} The section element.
     */
    function buildSeedSection() {
        const section = createSection('Seed', false);
        const content = section.querySelector('.section-content');

        const row = document.createElement('div');
        row.className = 'param-row-full';
        row.innerHTML =
            '<label for="seed-input">World Seed</label>' +
            '<div class="seed-row">' +
            '<input type="text" id="seed-input" autocomplete="off">' +
            '<button class="btn-secondary btn-small" id="btn-random-seed" type="button">Random</button>' +
            '</div>';
        content.appendChild(row);

        const readout = document.createElement('div');
        readout.className = 'seed-numeric-readout';
        readout.innerHTML = 'Numeric seed: <span id="seed-numeric">--</span>';
        content.appendChild(readout);

        return section;
    }

    /**
     * Build one collapsed schema-driven section (number / toggle / biome rows).
     * @param {string} name - Section title.
     * @param {Array<object>} entries - Schema entries belonging to this section.
     * @returns {HTMLElement} The section element.
     */
    function buildSchemaSection(name, entries) {
        const section = createSection(name, true);
        const content = section.querySelector('.section-content');
        for (const entry of entries) {
            let row;
            if (entry.kind === 'toggle') row = buildToggleRow(entry);
            else if (entry.kind === 'biome') row = buildBiomeGridRow(entry);
            else row = buildNumberRow(entry);
            rowWrappers[entry.key] = row;
            content.appendChild(row);
        }
        return section;
    }

    // ------------------------------------------------------------
    // ADVANCED TUNABLES PANEL (CCR-WORLDGEN-TUNABLES-001 Phase B, change #5)
    // Built from VX.GEN_TUNABLE_SCHEMA - same collapsible-section/row machinery as the
    // gen-param panel above, but writing through VX.applyGenTunables (DELTA merges, never
    // resetting omitted keys - the opposite asymmetry from genParams' full-object apply).
    // ------------------------------------------------------------

    /**
     * Build the "Advanced Tunables" area below the gen-param sections: a distinct header
     * (+ "Reset tunables" button when available), then one collapsed section per
     * GEN_TUNABLE_SCHEMA `section`, OR a diagnosable banner in place of the sections if the
