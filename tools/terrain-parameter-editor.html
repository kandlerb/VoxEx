     * live seam is missing the GEN_TUNABLES exports (non-fatal - see tunablesAvailable).
     * @returns {void}
     */
    function buildAdvancedTunablesArea() {
        const panel = document.getElementById('params-panel');

        const header = document.createElement('div');
        header.className = 'tunables-header';
        const title = document.createElement('h2');
        title.textContent = 'Advanced Tunables';
        header.appendChild(title);
        if (tunablesAvailable) {
            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.className = 'btn-secondary btn-small';
            resetBtn.id = 'btn-reset-tunables';
            resetBtn.textContent = 'Reset tunables';
            resetBtn.addEventListener('click', resetTunables);
            header.appendChild(resetBtn);
        }
        panel.appendChild(header);

        if (!tunablesAvailable) {
            const banner = document.createElement('div');
            banner.className = 'tunables-missing-banner';
            banner.innerHTML = tunablesMissingBannerHtml();
            panel.appendChild(banner);
            return;
        }

        tunableSectionsBySection = groupSchemaBySections(VX.GEN_TUNABLE_SCHEMA);
        for (const [sectionName, entries] of tunableSectionsBySection) {
            panel.appendChild(buildTunableSection(sectionName, entries));
        }
        markSectionDirtyMarkers();
    }

    /**
     * Build one collapsed Advanced Tunables section with a dirty-state marker in its header.
     * @param {string} name - Section title (e.g. "Relief & Peaks").
     * @param {Array<object>} entries - GEN_TUNABLE_SCHEMA entries belonging to this section.
     * @returns {HTMLElement} The section element.
     */
    function buildTunableSection(name, entries) {
        const section = createSection(name, true);
        const titleEl = section.querySelector('.section-title');
        const marker = document.createElement('span');
        marker.className = 'section-dirty-marker';
        marker.textContent = '●'; // filled dot - "differs from defaults" dial-in aid
        marker.style.display = 'none';
        titleEl.parentNode.insertBefore(marker, titleEl.nextSibling);
        tunableSectionDirtyMarkers[name] = marker;

        const content = section.querySelector('.section-content');
        for (const entry of entries) {
            const row = entry.kind === 'json' ? buildTunableJsonRow(entry) : buildTunableNumberRow(entry);
            content.appendChild(row);
        }
        return section;
    }

    /**
     * Build a free-form text-input row for a numeric tunable (schema `format: 'raw'` - NO
     * percent conversion, unlike gen-param rows). NaN/empty falls back to the registry
     * default; values are never clamped client-side. AUDIT NOTE (SWISS_WARP): the ONE
     * tunable with a server-side hard cap (< 14, enforced inside VX.applyGenTunables) - this
     * row always reflects the ACTUAL post-apply registry value, so a capped input is visibly
     * corrected rather than silently lying.
     * @param {object} entry - A GEN_TUNABLE_SCHEMA entry of kind 'number'.
     * @returns {HTMLElement} The row wrapper element (row + optional note text).
     */
    function buildTunableNumberRow(entry) {
        const wrap = document.createElement('div');
        wrap.className = 'tunable-row-wrap';

        const row = document.createElement('div');
        row.className = 'genparam-row';

        const label = document.createElement('label');
        label.textContent = entry.label;
        label.htmlFor = 'tunable-' + entry.key;

        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'decimal';
        input.autocomplete = 'off';
        input.id = 'tunable-' + entry.key;
        input.value = formatRawNumber(VX.GEN_TUNABLES[entry.key]);
        applyTunableWarnState(entry, input, VX.GEN_TUNABLES[entry.key]);
        input.addEventListener('change', () => onTunableNumberChange(entry, input));

        row.appendChild(label);
        row.appendChild(input);
        wrap.appendChild(row);
        if (entry.note) wrap.appendChild(buildTunableNoteEl(entry.note));

        tunableNumberControls[entry.key] = { input, entry };
        return wrap;
    }

    /**
     * Build a validated-JSON-textarea row for an object-valued tunable (splines, AXIS_W,
     * BIOME_PARAMS - CCR-WORLDGEN-TUNABLES-001 #4: curve UI deferred, v1 is a raw textarea).
     * @param {object} entry - A GEN_TUNABLE_SCHEMA entry of kind 'json'.
     * @returns {HTMLElement} The row wrapper element.
     */
    function buildTunableJsonRow(entry) {
        const wrap = document.createElement('div');
        wrap.className = 'tunable-row-wrap tunable-json-row';

        const label = document.createElement('label');
        label.textContent = entry.label;
        label.htmlFor = 'tunable-' + entry.key;
        wrap.appendChild(label);

        if (entry.note) wrap.appendChild(buildTunableNoteEl(entry.note));

        const textarea = document.createElement('textarea');
        textarea.className = 'tunable-json-textarea';
        textarea.id = 'tunable-' + entry.key;
        textarea.spellcheck = false;
        textarea.value = JSON.stringify(VX.GEN_TUNABLES[entry.key], null, 1);
        wrap.appendChild(textarea);

        const errorEl = document.createElement('div');
        errorEl.className = 'tunable-json-error';
        wrap.appendChild(errorEl);

        const applyBtn = document.createElement('button');
        applyBtn.type = 'button';
        applyBtn.className = 'btn-secondary btn-small';
        applyBtn.textContent = 'Apply';
        applyBtn.addEventListener('click', () => onTunableJsonApply(entry, textarea, errorEl));
        wrap.appendChild(applyBtn);

        tunableJsonControls[entry.key] = { textarea, errorEl, entry };
        return wrap;
    }

    /**
     * Build the small muted help-text element under a tunable row (the owner-required
     * OCTAVES explanation mechanism, also used for HF_PIVOT/VALLEY_RATIO/spline rows).
     * @param {string} text - Note text from the schema entry.
     * @returns {HTMLElement} The note element.
     */
    function buildTunableNoteEl(text) {
        const note = document.createElement('div');
        note.className = 'tunable-note-text';
        note.textContent = text;
        return note;
    }

    /**
     * Format a raw tunable number for display (no percent conversion - schema format is
     * 'raw'). Integers print bare; floats are rounded to 6 significant decimal digits to
     * avoid float-noise tails without losing precision that matters for these constants.
     * @param {number} v - The value to format.
     * @returns {string} Display string.
     */
    function formatRawNumber(v) {
        if (typeof v !== 'number' || !Number.isFinite(v)) return String(v);
        if (Number.isInteger(v)) return String(v);
        return String(Math.round(v * 1e6) / 1e6);
    }

    /**
     * Apply (or clear) the soft amber "outside tested range" warning on a tunable number
     * input - informational only, never a clamp (the SWISS_WARP hard cap is enforced
     * server-side inside VX.applyGenTunables, not here).
     * @param {object} entry - The GEN_TUNABLE_SCHEMA entry.
     * @param {HTMLInputElement} input - The input element to mark.
     * @param {number} value - The value to test against entry.tested.
     * @returns {void}
     */
    function applyTunableWarnState(entry, input, value) {
        const warned = Array.isArray(entry.tested) && (value < entry.tested[0] || value > entry.tested[1]);
        input.classList.toggle('genparam-warn', warned);
        input.title = warned ? `Outside tested range ${entry.tested[0]}-${entry.tested[1]}` : '';
    }

    /**
     * Handle a committed edit to a tunable number input: parse with parseFloat (raw format,
     * no percent), fall back to the registry default on NaN/empty, apply as a DELTA via
     * VX.applyGenTunables, then reflect the ACTUAL post-apply registry value back into the
     * box (handles both the fallback case and the SWISS_WARP hard-cap case identically).
     * @param {object} entry - The GEN_TUNABLE_SCHEMA entry being edited.
     * @param {HTMLInputElement} input - The text input element.
     * @returns {void}
     */
    function onTunableNumberChange(entry, input) {
        if (!VX || typeof VX.applyGenTunables !== 'function') return;
        const raw = input.value.trim();
        let value = parseFloat(raw);
        if (raw === '' || Number.isNaN(value)) value = VX.GEN_TUNABLE_DEFAULTS[entry.key];

        VX.applyGenTunables({ [entry.key]: value });

        const actual = VX.GEN_TUNABLES[entry.key];
        input.value = formatRawNumber(actual);
        applyTunableWarnState(entry, input, actual);

        afterTunablesChanged();
    }

    /**
     * Handle the "Apply" button on a tunable JSON row: parse, show an inline error and bail
     * on failure (leaving the registry untouched), otherwise apply as a DELTA and reflect the
     * actual post-apply registry value back into the textarea.
     * @param {object} entry - The GEN_TUNABLE_SCHEMA entry being edited.
     * @param {HTMLTextAreaElement} textarea - The JSON textarea element.
     * @param {HTMLElement} errorEl - Element to show a parse-error message in.
     * @returns {void}
     */
    function onTunableJsonApply(entry, textarea, errorEl) {
        if (!VX || typeof VX.applyGenTunables !== 'function') return;
        let parsed;
        try {
            parsed = JSON.parse(textarea.value);
        } catch (e) {
            errorEl.textContent = 'Parse error: ' + e.message;
            return;
        }
        errorEl.textContent = '';
        VX.applyGenTunables({ [entry.key]: parsed });
        textarea.value = JSON.stringify(VX.GEN_TUNABLES[entry.key], null, 1);

        afterTunablesChanged();
    }

    /**
     * Shared tail of every tunable-changing action: refresh the autosave/export mirror,
     * refresh dirty-section markers, re-render the preview, autosave, and push an undo/redo
     * snapshot.
     * @returns {void}
     */
    function afterTunablesChanged() {
        syncCurrentTunablesMirror();
        markSectionDirtyMarkers();
        if (renderer) renderer.scheduleRender();
        updateJSONPreview();
        autoSaveAll();
        pushHistorySnapshot();
    }

    /**
     * Deep-clone the live VX.GEN_TUNABLES registry into currentTunables (plain-data mirror
     * used for autosave/export/dirty-marking only - never mutated directly).
     * @returns {void}
     */
    function syncCurrentTunablesMirror() {
        currentTunables = (tunablesAvailable && VX.GEN_TUNABLES) ? deepClone(VX.GEN_TUNABLES) : null;
    }

    /**
     * Deep-clone a plain-data (JSON-safe) object or value.
     * @param {*} value - Value to clone.
     * @returns {*} A structurally-identical, independent copy.
     */
    function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
    }

    /**
     * Compute the subset of currentTunables that differs from VX.GEN_TUNABLE_DEFAULTS
     * (used for autosave and export - "only keys differing from defaults" per the CCR).
     * @returns {Object<string, *>} Non-default tunable key/value pairs.
     */
    function computeNonDefaultTunables() {
        const delta = {};
        if (!tunablesAvailable || !currentTunables || !VX.GEN_TUNABLE_DEFAULTS) return delta;
        for (const key in currentTunables) {
            if (JSON.stringify(currentTunables[key]) !== JSON.stringify(VX.GEN_TUNABLE_DEFAULTS[key])) {
                delta[key] = currentTunables[key];
            }
        }
        return delta;
    }

    /**
     * Refresh the dirty-state dot marker on every Advanced Tunables section header,
     * comparing currentTunables against VX.GEN_TUNABLE_DEFAULTS per section.
     * @returns {void}
     */
    function markSectionDirtyMarkers() {
        if (!tunablesAvailable || !currentTunables) return;
        for (const [sectionName, entries] of tunableSectionsBySection) {
            let dirty = false;
            for (const entry of entries) {
                if (JSON.stringify(currentTunables[entry.key]) !== JSON.stringify(VX.GEN_TUNABLE_DEFAULTS[entry.key])) {
                    dirty = true;
                    break;
                }
            }
            const markerEl = tunableSectionDirtyMarkers[sectionName];
            if (markerEl) markerEl.style.display = dirty ? 'inline' : 'none';
        }
    }

    /**
     * Refresh every built tunable control's displayed value from the live VX.GEN_TUNABLES
     * registry (used after undo/redo, reset-tunables, and import).
     * @returns {void}
     */
    function refreshAllTunableControlValues() {
        if (!tunablesAvailable) return;
        for (const key in tunableNumberControls) {
            const { input, entry } = tunableNumberControls[key];
            const value = VX.GEN_TUNABLES[key];
            input.value = formatRawNumber(value);
            applyTunableWarnState(entry, input, value);
        }
        for (const key in tunableJsonControls) {
            const { textarea, errorEl } = tunableJsonControls[key];
            textarea.value = JSON.stringify(VX.GEN_TUNABLES[key], null, 1);
            errorEl.textContent = '';
        }
        syncCurrentTunablesMirror();
        markSectionDirtyMarkers();
    }

    /**
     * "Reset tunables" button handler: restore every GEN_TUNABLES key to its default via
     * VX.resetGenTunables(), refresh all controls, and re-render.
     * @returns {void}
     */
    function resetTunables() {
        if (!tunablesAvailable || typeof VX.resetGenTunables !== 'function') return;
        VX.resetGenTunables();
        refreshAllTunableControlValues();
        if (renderer) renderer.scheduleRender();
        updateJSONPreview();
        autoSaveAll();
        pushHistorySnapshot();
    }

    /**
     * Build a free-form text-input row for a numeric gen param (no slider, no clamp).
     * @param {object} entry - A GEN_PARAM_SCHEMA entry of kind 'number'.
     * @returns {HTMLElement} The row element.
     */
    function buildNumberRow(entry) {
        const row = document.createElement('div');
        row.className = 'genparam-row';

        const label = document.createElement('label');
        label.textContent = entry.label;
        label.htmlFor = 'genparam-' + entry.key;

        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'decimal';
        input.autocomplete = 'off';
        input.id = 'genparam-' + entry.key;
        input.value = VX.formatGenParam(entry, currentParams[entry.key]);
        input.addEventListener('change', () => onSchemaNumberChange(entry, input));

        row.appendChild(label);
        row.appendChild(input);
        numberRowControls[entry.key] = { input, entry };
        return row;
    }

    /**
     * Build a checkbox row for a boolean gen param.
     * @param {object} entry - A GEN_PARAM_SCHEMA entry of kind 'toggle'.
     * @returns {HTMLElement} The row element.
     */
    function buildToggleRow(entry) {
        const row = document.createElement('div');
        row.className = 'checkbox-row genparam-toggle-row';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = 'genparam-' + entry.key;
        checkbox.checked = !!currentParams[entry.key];
        checkbox.addEventListener('change', () => onSchemaToggleChange(entry, checkbox.checked));

        const label = document.createElement('label');
        label.textContent = entry.label;
        label.htmlFor = checkbox.id;

        row.appendChild(checkbox);
        row.appendChild(label);
        toggleRowControls[entry.key] = { input: checkbox, entry };
        return row;
    }

    /**
     * Build the biome-picker button grid (owner decision Q3: visual parity with the
     * create-world #biome-selector) for the `selectedBiome` schema entry.
     * @param {object} entry - The GEN_PARAM_SCHEMA entry of kind 'biome'.
     * @returns {HTMLElement} The row element.
     */
    function buildBiomeGridRow(entry) {
        const wrap = document.createElement('div');
        wrap.className = 'param-row-full';

        const label = document.createElement('label');
        label.textContent = entry.label;
        wrap.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'biome-grid';
        grid.id = 'genparam-' + entry.key;

        const defaultBtn = document.createElement('button');
        defaultBtn.type = 'button';
        defaultBtn.className = 'biome-btn';
        defaultBtn.dataset.biome = 'default';
        defaultBtn.textContent = 'Default (Mixed Biomes)';
        defaultBtn.addEventListener('click', () => onBiomeGridSelect(null));
        grid.appendChild(defaultBtn);

        const biomeNames = VX.BIOME_CONFIG ? Object.keys(VX.BIOME_CONFIG) : [];
        for (const biomeName of biomeNames) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'biome-btn';
            btn.dataset.biome = biomeName;
            btn.textContent = `${BIOME_EMOJI[biomeName] || '🌍'} ${biomeName}`;
            btn.addEventListener('click', () => onBiomeGridSelect(biomeName));
            grid.appendChild(btn);
        }

        wrap.appendChild(grid);
        biomeGridEl = grid;
        updateBiomeGridSelection();
        return wrap;
    }

    /**
     * Sync the biome-picker grid's `.selected` button to currentParams.selectedBiome.
     * @returns {void}
     */
    function updateBiomeGridSelection() {
        if (!biomeGridEl) return;
        const selected = currentParams.selectedBiome || 'default';
        const buttons = biomeGridEl.querySelectorAll('.biome-btn');
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].classList.toggle('selected', buttons[i].dataset.biome === selected);
        }
    }

    /**
     * Handle a biome-grid button click.
     * @param {string|null} biomeName - Biome key, or null for "Default (Mixed Biomes)".
     * @returns {void}
     */
    function onBiomeGridSelect(biomeName) {
        currentParams.selectedBiome = biomeName;
        updateBiomeGridSelection();
        commitParamsChange();
    }

    /**
     * Handle a committed (change event) edit to a free-form numeric gen-param input:
     * parse via the seam's parseGenParamInput (percent conversion, NaN fallback, soft
     * out-of-range warning - never a clamp), apply, and re-render.
     * @param {object} entry - The GEN_PARAM_SCHEMA entry being edited.
     * @param {HTMLInputElement} input - The text input element.
     * @returns {void}
     */
    function onSchemaNumberChange(entry, input) {
        if (!VX || typeof VX.parseGenParamInput !== 'function') return;
        const result = VX.parseGenParamInput(entry, input.value);
        currentParams[entry.key] = result.value;
        input.classList.toggle('genparam-warn', !!result.warned);
        input.title = (result.warned && entry.tested)
            ? `Outside tested range ${entry.tested[0]}-${entry.tested[1]}`
            : '';
        if (result.fellBack) input.value = VX.formatGenParam(entry, result.value);
        commitParamsChange();
        // Owner decision Q4: Spawn X/Z edits pan the preview to that position.
        if (entry.key === 'spawnX' || entry.key === 'spawnZ') {
            renderer.panTo(currentParams.spawnX ?? 0, currentParams.spawnZ ?? 0);
        }
    }

    /**
     * Handle a toggle checkbox change: update the param, refresh showIf visibility,
     * apply, and re-render.
     * @param {object} entry - The GEN_PARAM_SCHEMA entry being edited.
     * @param {boolean} checked - New checkbox state.
     * @returns {void}
     */
    function onSchemaToggleChange(entry, checked) {
        currentParams[entry.key] = checked;
        applyShowIfVisibility();
        commitParamsChange();
    }

    /**
     * Show/hide every row whose schema entry declares `showIf` based on the current
     * value of the controlling toggle key.
     * @returns {void}
     */
    function applyShowIfVisibility() {
        if (!VX || !VX.GEN_PARAM_SCHEMA) return;
        for (const entry of VX.GEN_PARAM_SCHEMA) {
            if (!entry.showIf) continue;
            const row = rowWrappers[entry.key];
            if (row) row.style.display = currentParams[entry.showIf] ? '' : 'none';
        }
    }

    /**
     * Refresh every built control's displayed value from currentParams (used after
     * undo/redo, reset, preset load, and import).
     * @returns {void}
     */
    function refreshAllControlValues() {
        const seedInput = document.getElementById('seed-input');
        if (seedInput) seedInput.value = currentSeedStr;

        for (const key in numberRowControls) {
            const { input, entry } = numberRowControls[key];
            input.value = VX.formatGenParam(entry, currentParams[key]);
            input.classList.remove('genparam-warn');
            input.title = '';
        }
        for (const key in toggleRowControls) {
            toggleRowControls[key].input.checked = !!currentParams[key];
        }
        applyShowIfVisibility();
        updateBiomeGridSelection();
    }

    // ------------------------------------------------------------
    // APPLY / COMMIT
    // ------------------------------------------------------------

    /**
     * Apply the COMPLETE currentParams object to the live game, together with the
     * editor's CURRENT tunables delta (CCR-WORLDGEN-TUNABLES-001 Option B: since
     * voxEx.html's VX.applyGenParams(p) grew a tri-state `p.tunables` contract -
     * absent/undefined RESETS ALL tunables to defaults, a plain object resets-then-
     * applies it as a delta, explicit `null` leaves the registry untouched. Every
     * genParam edit here calls applyGenParams, so omitting `tunables` would silently
     * wipe the user's dialed-in tunables on every keystroke. Re-syncing the mirror
     * from the live registry right before reading it (rather than trusting whatever
     * the last tunables-side action left behind) makes this self-healing regardless
     * of call path: undo/redo and JSON import both write VX.GEN_TUNABLES directly
     * before calling commitParamsChange, and this pulls the resulting state back out
     * as the delta it then re-applies - so the round trip is a no-op on the registry.
     * @returns {void}
     */
    function applyParamsToGame() {
        if (!VX || typeof VX.applyGenParams !== 'function') return;
        if (tunablesAvailable) syncCurrentTunablesMirror();
        const tunables = tunablesAvailable ? computeNonDefaultTunables() : null;
        VX.applyGenParams(Object.assign({}, currentParams, { tunables }));
    }

    /**
     * Apply the COMPLETE currentParams object (+ current tunables delta, see
     * applyParamsToGame) to the live game (CCR-WORLDGEN-UI-001 AUDIT FLAG: a partial
     * genParams object would silently reset every omitted knob to default), schedule
     * a re-render, refresh the JSON preview, autosave, and push an undo/redo snapshot.
     * @param {boolean} [pushHistory=true] - Whether to push an undo/redo snapshot.
     * @returns {void}
     */
    function commitParamsChange(pushHistory = true) {
        applyParamsToGame();
        if (renderer) renderer.scheduleRender();
        updateJSONPreview();
        autoSaveAll();
        if (pushHistory) pushHistorySnapshot();
    }

    /**
     * Push a combined `{ params, tunables }` snapshot onto the undo/redo history (CCR-
     * WORLDGEN-TUNABLES-001 #5: HistoryManager snapshots now cover BOTH). Stores the FULL
     * currentTunables (not just the non-default delta used for autosave/export) so undo/redo
     * restores exact prior state.
     * @returns {void}
     */
    function pushHistorySnapshot() {
        if (!history) return;
        history.push({
            params: Object.assign({}, currentParams),
            tunables: (tunablesAvailable && currentTunables) ? deepClone(currentTunables) : null
        });
    }

    /**
     * Restore a combined `{ params, tunables }` undo/redo snapshot: replace currentParams
     * wholesale, refresh gen-param controls, and (if tunables are available AND the
     * snapshot carries a tunables object) replace the ENTIRE live registry via
     * VX.applyGenTunables (a full snapshot, not a delta - every key present overwrites the
     * registry back to its exact prior value).
     * @param {{params: object, tunables: (Object<string,*>|null)}} state - History snapshot.
     * @returns {void}
     */
    function restoreHistorySnapshot(state) {
        currentParams = state.params;
        refreshAllControlValues();
        if (tunablesAvailable && state.tunables && typeof VX.applyGenTunables === 'function') {
            VX.applyGenTunables(state.tunables);
            refreshAllTunableControlValues();
        }
        commitParamsChange(false);
    }

    /**
     * Refresh the numeric seed readout (VX.worldSeed) after a reseed.
     * @returns {void}
     */
    function updateSeedNumericReadout() {
        const el = document.getElementById('seed-numeric');
        if (el && VX && typeof VX.worldSeed === 'number') el.textContent = VX.worldSeed.toFixed(4);
    }

    /**
     * Reseed the live game's noise from a new seed string and re-render. Seed is not
     * part of genParams, so this does not touch the undo/redo history.
     * @param {string} newSeedStr - The new seed string.
     * @returns {void}
     */
    function handleSeedChange(newSeedStr) {
        currentSeedStr = newSeedStr;
        if (VX && typeof VX.seedNoise === 'function') VX.seedNoise(currentSeedStr);
        // Clear the legacy biome-cell cache (keyed by cell coords only, not seed) in
        // case the legacy A/B path is active - mirrors terrain-visualizer.html.
        if (VX && VX.biomeCellCache && typeof VX.biomeCellCache.clear === 'function') VX.biomeCellCache.clear();
        updateSeedNumericReadout();
        autoSaveAll();
        if (renderer) renderer.scheduleRender();
    }

    /**
     * Header button: "Randomize Seed" (repurposed from the old "Randomize All" -
     * randomizing free-form params blindly is no longer meaningful once every knob
     * is an unclamped text box, so only the seed is randomized).
     * @returns {void}
     */
    function randomizeSeed() {
        const newSeed = Math.floor(Math.random() * 2147483647).toString();
        document.getElementById('seed-input').value = newSeed;
        handleSeedChange(newSeed);
    }

    /**
     * Header button: reset all gen params to VX.DEFAULT_GEN_PARAMS (seed untouched).
     * @returns {void}
     */
    function resetToDefaults() {
        currentParams = Object.assign({}, VX.DEFAULT_GEN_PARAMS);
        refreshAllControlValues();
        commitParamsChange();
    }

    // ------------------------------------------------------------
    // PRESETS (built-in VX.WORLD_PRESETS + user localStorage presets)
    // ------------------------------------------------------------

    /**
     * Load user-saved presets from localStorage.
     * @returns {Object<string, object>} Saved presets (name -> full genParams object).
     */
    function loadUserPresets() {
        try {
            const saved = localStorage.getItem(PRESET_STORAGE_KEY);
            return saved ? JSON.parse(saved) : {};
        } catch (e) {
            return {};
        }
    }

    /**
     * Persist user-saved presets to localStorage.
     * @returns {void}
     */
    function saveUserPresetsToStorage() {
        try {
            localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(userPresets));
        } catch (e) {
            // Ignore storage errors (private browsing / quota).
        }
    }

    /**
     * Rebuild the presets list: read-only Built-in rows from VX.WORLD_PRESETS (owner
     * decision Q2) followed by deletable User rows from localStorage.
     * @returns {void}
     */
    function updatePresetsUI() {
        const list = document.getElementById('presets-list');
        list.innerHTML = '';

        const builtins = (VX && VX.WORLD_PRESETS) || {};
        for (const name of Object.keys(builtins)) {
            list.appendChild(buildPresetItem(name, 'Built-in', () => loadBuiltinPreset(name), null));
        }
        for (const name of Object.keys(userPresets)) {
            list.appendChild(buildPresetItem(name, 'User', () => loadUserPreset(name), () => deleteUserPreset(name)));
        }
    }

    /**
     * Build one preset row.
     * @param {string} name - Preset name.
     * @param {string} typeLabel - "Built-in" or "User".
     * @param {function(): void} onLoad - Load button handler.
     * @param {(function(): void)|null} onDelete - Delete button handler, or null to omit the button (built-ins).
     * @returns {HTMLElement} The preset row element.
     */
    function buildPresetItem(name, typeLabel, onLoad, onDelete) {
        const item = document.createElement('div');
        item.className = 'preset-item';
        item.innerHTML =
            '<div>' +
            '<div class="preset-name"></div>' +
            '<div class="preset-type"></div>' +
            '</div>' +
            '<div class="preset-actions">' +
            '<button class="btn-primary btn-small preset-load" type="button">Load</button>' +
            (onDelete ? '<button class="btn-danger btn-small preset-delete" type="button">Del</button>' : '') +
            '</div>';
        item.querySelector('.preset-name').textContent = name;
        item.querySelector('.preset-type').textContent = typeLabel;
        item.querySelector('.preset-load').addEventListener('click', onLoad);
        if (onDelete) item.querySelector('.preset-delete').addEventListener('click', onDelete);
        return item;
    }

    /**
     * Load a built-in VX.WORLD_PRESETS entry: map its percent fields onto the
     * multiplier keys (/100) and its booleans onto the enable keys, leaving
     * noise/spawn/selectedBiome at their current values (unspecified by the preset).
     * @param {string} name - Preset key (e.g. 'archipelago').
     * @returns {void}
     */
    function loadBuiltinPreset(name) {
        const preset = VX.WORLD_PRESETS[name];
        if (!preset) return;
        if (preset.terrainAmplitude !== undefined) currentParams.terrainAmplitudeMultiplier = preset.terrainAmplitude / 100;
        if (preset.seaLevel !== undefined) currentParams.seaLevel = preset.seaLevel;
        if (preset.caveDensity !== undefined) currentParams.caveDensityMultiplier = preset.caveDensity / 100;
        if (preset.treeDensity !== undefined) currentParams.treeDensityMultiplier = preset.treeDensity / 100;
        if (preset.biomeSize !== undefined) currentParams.biomeSizeMultiplier = preset.biomeSize / 100;
        if (preset.enableRivers !== undefined) currentParams.enableRivers = preset.enableRivers;
        if (preset.enableTrees !== undefined) currentParams.enableTrees = preset.enableTrees;
        if (preset.enableCaves !== undefined) currentParams.enableCaves = preset.enableCaves;
        refreshAllControlValues();
        commitParamsChange();
    }

    /**
     * Load a full user-saved genParams preset (complete object - replaces currentParams
     * wholesale, defaulted through VX.DEFAULT_GEN_PARAMS for forward/backward safety).
     * @param {string} name - User preset name.
     * @returns {void}
     */
    function loadUserPreset(name) {
        const saved = userPresets[name];
        if (!saved) return;
        currentParams = Object.assign({}, VX.DEFAULT_GEN_PARAMS, saved);
        refreshAllControlValues();
        commitParamsChange();
    }

    /**
     * Delete a user preset after confirmation.
     * @param {string} name - User preset name.
     * @returns {void}
     */
    function deleteUserPreset(name) {
        if (!confirm(`Delete preset "${name}"?`)) return;
        delete userPresets[name];
        saveUserPresetsToStorage();
        updatePresetsUI();
    }

    /**
     * Save the current genParams as a new named user preset.
     * @returns {void}
     */
    function saveCurrentAsPreset() {
        const name = prompt('Enter preset name:');
        if (!name || !name.trim()) return;
        userPresets[name.trim()] = Object.assign({}, currentParams);
        saveUserPresetsToStorage();
        updatePresetsUI();
    }

    // ------------------------------------------------------------
    // EXPORT / IMPORT (genParams JSON round-trip)
    // ------------------------------------------------------------

    /**
     * Refresh the read-only JSON preview textarea from currentParams.
     * @returns {void}
     */
    function updateJSONPreview() {
        document.getElementById('json-preview').value = JSON.stringify(buildExportObject(), null, 2);
    }

    /**
     * Build the export object: `{ genParams, tunables }` (CCR-WORLDGEN-TUNABLES-001 #5).
     * `tunables` holds ONLY keys differing from GEN_TUNABLE_DEFAULTS, and is omitted
     * entirely when the Advanced Tunables seam is unavailable (rather than emitting an
     * empty-but-present block). This is a NEW export shape, distinct from the bare
     * genParams v3 object CCR-WORLDGEN-UI-001 exported - see applyImportedObject() for the
     * backward-compat import path.
     * @returns {{genParams: object, tunables?: Object<string,*>}} The export object.
     */
    function buildExportObject() {
        const obj = { genParams: Object.assign({}, currentParams) };
        if (tunablesAvailable) obj.tunables = computeNonDefaultTunables();
        return obj;
    }

    /**
     * Download the current export object as a genParams.json file.
     * @returns {void}
     */
    function downloadJSON() {
        const json = JSON.stringify(buildExportObject(), null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'genParams.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    /**
     * Copy the current export object JSON to the clipboard. Backs both "Copy to
     * Clipboard" and the repurposed "Copy for VoxEx" button (both copy the same
     * `{ genParams, tunables }` JSON, which imports directly into the game's Create
     * New World page - CCR-WORLDGEN-TUNABLES-001 Option B - including the tunables
     * block).
     * @returns {void}
     */
    function copyCurrentParamsToClipboard() {
        navigator.clipboard.writeText(JSON.stringify(buildExportObject(), null, 2))
            .catch((e) => console.error('Failed to copy:', e));
    }

    /**
     * Show a transient note under the export/import controls.
     * @param {string} text - Note text.
     * @returns {void}
     */
    function setImportNote(text) {
        const el = document.getElementById('import-note');
        if (el) el.textContent = text;
    }

    /**
     * Validate and apply an imported plain object. Accepts BOTH shapes: this tool's own
     * `{ genParams, tunables }` export (CCR-WORLDGEN-TUNABLES-001 #5) AND the bare
     * genParams v3 object CCR-WORLDGEN-UI-001 exported (backward compat - detected by the
     * absence of a `genParams` sub-object). Only keys present in VX.DEFAULT_GEN_PARAMS are
     * accepted into currentParams (others ignored with a visible note), merged onto the
     * current object (an omitted key keeps its CURRENT value rather than being reset). A
     * `tunables` block is applied via VX.applyGenTunables when the seam is available, or
     * flagged as ignored when it is not.
     * @param {object} obj - Parsed JSON object (file or paste).
     * @returns {void}
     */
    function applyImportedObject(obj) {
        const hasWrappedShape = obj && typeof obj === 'object' && obj.genParams && typeof obj.genParams === 'object';
        const genParamsObj = hasWrappedShape ? obj.genParams : obj;
        const tunablesObj = (hasWrappedShape && obj.tunables && typeof obj.tunables === 'object') ? obj.tunables : null;

        const knownKeys = new Set(Object.keys((VX && VX.DEFAULT_GEN_PARAMS) || {}));
        const unknown = [];
        for (const key of Object.keys(genParamsObj)) {
            if (knownKeys.has(key)) currentParams[key] = genParamsObj[key];
            else unknown.push(key);
        }
        refreshAllControlValues();

        let tunablesNote = '';
        if (tunablesObj) {
            if (tunablesAvailable && typeof VX.applyGenTunables === 'function') {
                VX.applyGenTunables(tunablesObj);
                refreshAllTunableControlValues();
            } else {
                tunablesNote = ' Tunables block present but ignored (GEN_TUNABLES seam unavailable).';
            }
        }

        commitParamsChange();
        setImportNote((unknown.length > 0
            ? `Imported. Ignored unknown keys: ${unknown.join(', ')}`
            : 'Imported successfully.') + tunablesNote);
    }

    /**
     * Import genParams JSON from a File (the "Import JSON File" button's file picker).
     * @param {File} file - The selected JSON file.
     * @returns {void}
     */
    function importJSONFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                applyImportedObject(JSON.parse(e.target.result));
            } catch (err) {
                alert('Invalid JSON file: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    /**
     * Import genParams JSON pasted into a prompt dialog (the "Paste JSON" button).
     * @returns {void}
     */
    function importJSONFromPaste() {
        const text = prompt('Paste genParams JSON:');
        if (!text) return;
        try {
            applyImportedObject(JSON.parse(text));
        } catch (err) {
            alert('Invalid JSON: ' + err.message);
        }
    }

    // ------------------------------------------------------------
    // AUTOSAVE (localStorage)
    // ------------------------------------------------------------

    /**
     * Autosave the current seed string + genParams object to localStorage.
     * @returns {void}
     */
    function autoSaveAll() {
        try {
            const tunablesDelta = tunablesAvailable ? computeNonDefaultTunables() : {};
            localStorage.setItem(AUTOSAVE_STORAGE_KEY, JSON.stringify({
                seed: currentSeedStr, params: currentParams, tunables: tunablesDelta
            }));
        } catch (e) {
            // Ignore storage errors.
        }
    }

    /**
     * Restore the autosaved seed string + genParams object + tunables delta, if present.
     * Called once at boot, before the seam-ready tunables-availability check - so the
     * tunables delta is stashed in pendingTunablesAutosave and applied via a single
     * VX.applyGenTunables() call afterward (see onVoxExReady), never here directly.
     * @returns {void}
     */
    function loadAutoSave() {
        try {
            const saved = localStorage.getItem(AUTOSAVE_STORAGE_KEY);
            if (!saved) return;
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed.seed === 'string') currentSeedStr = parsed.seed;
            if (parsed && parsed.params && typeof parsed.params === 'object') {
                currentParams = Object.assign({}, VX.DEFAULT_GEN_PARAMS, parsed.params);
            }
            if (parsed && parsed.tunables && typeof parsed.tunables === 'object') {
                pendingTunablesAutosave = parsed.tunables;
            }
        } catch (e) {
            // Ignore errors - fall back to defaults already set by the caller.
        }
    }

    // ------------------------------------------------------------
    // EVENT WIRING
    // ------------------------------------------------------------

    /**
     * Wire every static DOM control (preview toolbar, canvas pan/zoom, header
     * buttons, presets, export/import). Schema-driven param rows wire themselves
     * at build time (see buildNumberRow / buildToggleRow / buildBiomeGridRow).
     * @returns {void}
     */
    function setupEventListeners() {
        const canvas = document.getElementById('preview-canvas');

        // Preview mode buttons (CCR-WORLDGEN-TUNABLES-001 #6: Heightmap/Biomes/Map/Combined).
        document.querySelectorAll('.preview-modes button').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preview-modes button').forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                const mode = btn.dataset.mode;
                renderer.setMode(mode);
                document.getElementById('precarve-toggle').style.display = mode === 'heightmap' ? 'flex' : 'none';
            });
        });

        // Quality selector.
        document.getElementById('preview-quality').addEventListener('change', (e) => {
            renderer.setSize(parseInt(e.target.value, 10));
        });

        // Heightmap-only "Base surface (pre-carve)" checkbox (CCR-WORLDGEN-TUNABLES-001 #6 /
        // Q2): swaps the Heightmap sampler from VX.blendedHeight (final carved) to
        // VX.terrainSurface (pre-carve base).
        document.getElementById('heightmap-precarve').addEventListener('change', (e) => {
            renderer.setPreCarve(e.target.checked);
        });

        // Zoom control buttons.
        document.getElementById('zoom-in').addEventListener('click', () => {
            renderer.zoomAt(1.5, canvas.width / 2, canvas.height / 2);
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            renderer.zoomAt(0.67, canvas.width / 2, canvas.height / 2);
        });
        document.getElementById('zoom-reset').addEventListener('click', () => {
            renderer.resetView();
        });

        // Canvas pan/zoom + cursor info.
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            if (VX && px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                const info = renderer.getInfoAt(px, py);
                document.getElementById('cursor-pos').textContent = `X: ${info.x}, Z: ${info.z}`;
                document.getElementById('cursor-height').textContent = Number.isFinite(info.carvedHeight) ? Math.round(info.carvedHeight) : '--';
                document.getElementById('cursor-height-precarve').textContent = Number.isFinite(info.preCarveHeight) ? Math.round(info.preCarveHeight) : '--';
                document.getElementById('cursor-biome').textContent = info.biome;
            }

            if (isDragging) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                renderer.pan(dx, dy);
                lastX = e.clientX;
                lastY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.2 : 0.83;
            renderer.zoomAt(factor, x, y);
        }, { passive: false });

        // Seed section.
        document.getElementById('seed-input').addEventListener('change', (e) => handleSeedChange(e.target.value));
        document.getElementById('btn-random-seed').addEventListener('click', randomizeSeed);

        // Header buttons.
        document.getElementById('btn-randomize-all').addEventListener('click', randomizeSeed);
        document.getElementById('btn-reset-all').addEventListener('click', resetToDefaults);

        document.getElementById('btn-undo').addEventListener('click', () => {
            const state = history.undo();
            if (!state) return;
            history.isRestoring = true;
            restoreHistorySnapshot(state);
            history.isRestoring = false;
        });

        document.getElementById('btn-redo').addEventListener('click', () => {
            const state = history.redo();
            if (!state) return;
            history.isRestoring = true;
            restoreHistorySnapshot(state);
            history.isRestoring = false;
        });

        document.addEventListener('keydown', (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            if (e.key === 'z') { e.preventDefault(); document.getElementById('btn-undo').click(); }
            else if (e.key === 'y') { e.preventDefault(); document.getElementById('btn-redo').click(); }
        });

        // Presets.
        document.getElementById('btn-save-preset').addEventListener('click', saveCurrentAsPreset);

        // Export / import.
        document.getElementById('btn-export-json').addEventListener('click', downloadJSON);
        document.getElementById('btn-copy-json').addEventListener('click', copyCurrentParamsToClipboard);
        document.getElementById('btn-copy-voxex').addEventListener('click', copyCurrentParamsToClipboard);
        document.getElementById('btn-import-json').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });
        document.getElementById('import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) importJSONFile(file);
            e.target.value = '';
        });
        document.getElementById('btn-import-paste').addEventListener('click', importJSONFromPaste);
    }

    // ------------------------------------------------------------
    // BOOT
    // ------------------------------------------------------------

    window.addEventListener('load', bootVoxEx);
    </script>
</body>
</html>
