<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VoxEx Test Suite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', monospace; background: #1a1a1a; color: #eee; padding: 20px; }
h1 { color: #4caf50; margin-bottom: 4px; }
.subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
.suite { background: #222; border-radius: 8px; margin-bottom: 16px; padding: 16px; border-left: 4px solid #444; }
.suite.pass { border-left-color: #4caf50; }
.suite.fail { border-left-color: #f44336; }
.suite-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
.test { padding: 4px 0 4px 16px; font-size: 13px; }
.test.pass { color: #81c784; }
.test.pass::before { content: "PASS "; font-weight: bold; }
.test.fail { color: #ef5350; }
.test.fail::before { content: "FAIL "; font-weight: bold; }
.test-detail { color: #999; font-size: 12px; padding-left: 48px; }
.summary { background: #333; padding: 16px; border-radius: 8px; margin-bottom: 20px; font-size: 16px; }
.summary.all-pass { border: 2px solid #4caf50; }
.summary.has-fail { border: 2px solid #f44336; }
.terrain-viz { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
.terrain-canvas { border: 1px solid #444; border-radius: 4px; }
.terrain-label { font-size: 12px; color: #aaa; text-align: center; }
#run-btn { background: #4caf50; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-bottom: 16px; }
#run-btn:hover { background: #66bb6a; }
</style>
</head>
<body>
<h1>VoxEx Test Suite</h1>
<p class="subtitle">Standalone tests for pure functions extracted from voxEx.html (~43K lines)</p>
<button id="run-btn" onclick="runAllTests()">Run All Tests</button>
<div id="summary"></div>
<div id="results"></div>
<div id="terrain-viz-container"></div>

<script>
// ============================================================

const suites = [];

function expect(actual) {

        toBeCloseTo(expected, digits = 5) { const eps = Math.pow(10, -digits); if (Math.abs(actual - expected) > eps) throw new Error(`Expected ~${expected} (+-${eps}), got ${actual}`); },

        toBeLessThan(v) { if (!(actual < v)) throw new Error(`Expected <${v}, got ${actual}`); },
        toBeGreaterThanOrEqual(v) { if (!(actual >= v)) throw new Error(`Expected >=${v}, got ${actual}`); },
        toBeLessThanOrEqual(v) { if (!(actual <= v)) throw new Error(`Expected <=${v}, got ${actual}`); },
        toBeTruthy() { if (!actual) throw new Error(`Expected truthy, got ${actual}`); },
        toBeFalsy() { if (actual) throw new Error(`Expected falsy, got ${actual}`); },
        toBeInstanceOf(cls) { if (!(actual instanceof cls)) throw new Error(`Expected instance of ${cls.name}`); },
        toHaveLength(len) { if (actual.length !== len) throw new Error(`Expected length ${len}, got ${actual.length}`); },
        toBeNaN() { if (!isNaN(actual)) throw new Error(`Expected NaN, got ${actual}`); },
        toBeFinite() { if (!isFinite(actual)) throw new Error(`Expected finite, got ${actual}`); },

function renderResults() {
    const container = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    let html = '';
    for (const suite of suites) {
        totalPass += suite.passed; totalFail += suite.failed;
        const cls = suite.failed > 0 ? 'fail' : 'pass';
        html += `<div class="suite ${cls}"><div class="suite-title">${suite.name} (${suite.passed}/${suite.tests.length})</div>`;
        for (const test of suite.tests) {
            html += `<div class="test ${test.passed ? 'pass' : 'fail'}">${test.name}</div>`;
            if (test.error) html += `<div class="test-detail">${test.error}</div>`;
        }
        html += '</div>';
    }
    container.innerHTML = html;
    const total = totalPass + totalFail;
    const cls = totalFail > 0 ? 'has-fail' : 'all-pass';

// ============================================================
// EXTRACTED CONSTANTS
// ============================================================

// Block lookup tables
const BLOCK_IS_SOLID = new Uint8Array(256);

}
initBlockLookupTables();

// Quantization lookup tables for getMergeKey
const AO_QUANT_LOOKUP = new Uint8Array(101);

// ============================================================
// EXTRACTED PURE FUNCTIONS (Tier 1 - zero deps)
// ============================================================
function blockIndex(lx, ly, lz) { return lx + (lz << 4) + (ly << 8); }
function safeGetBlock(chunk, lx, ly, lz, defaultValue = AIR) {

function dist2DSq(x1, z1, x2, z2) { const dx = x2 - x1, dz = z2 - z1; return dx * dx + dz * dz; }

}

    const idx2 = Math.round(Math.max(0, Math.min(1, ao[2])) * 100);
    const idx3 = Math.round(Math.max(0, Math.min(1, ao[3])) * 100);

function writeFaceVertices(pos, norm, vIdx, verts, wx, wy, wz, nx, ny, nz) {

}

// --- Biome config ---

    hills: { weight: 2, baseHeight: 65, amplitude: 40, roughness: 0.01, tags: [] },
    forests: { weight: 2, baseHeight: 62, amplitude: 15, roughness: 0.008, tags: ["forested"] },
    mountains: { weight: 1, baseHeight: 70, amplitude: 180, roughness: 0.005, tags: ["mountain"] },
    swamp: { weight: 1, baseHeight: 58, amplitude: 6, roughness: 0.008, tags: [] },
    longwoods: { weight: 2, baseHeight: 62, amplitude: 12, roughness: 0.006, tags: ["giant_trees"] },
    mountain_foothills: { weight: 0, baseHeight: 70, amplitude: 120, roughness: 0.005, tags: ["mountain"] }

        it("leaves attenuate by 1", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; for (let ly = 100; ly < 105; ly++) for (let x = 0; x < 16; x++) for (let z = 0; z < 16; z++) chunk.blocks[blockIndex(x, ly, z)] = LEAVES; calculateChunkSunlight(chunk, 16, 320); expect(chunk.skyLight[blockIndex(8, 105, 8)]).toBe(15); expect(chunk.skyLight[blockIndex(8, 99, 8)]).toBe(10); });
        it("minimum light = 1", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; for (let ly = 80; ly < 100; ly++) for (let x = 0; x < 16; x++) for (let z = 0; z < 16; z++) chunk.blocks[blockIndex(x, ly, z)] = LEAVES; calculateChunkSunlight(chunk, 16, 320); expect(chunk.skyLight[blockIndex(8, 60, 8)]).toBe(1); });
        it("horizontal BFS into cave", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) };
            // Solid ceiling at y=100, except one opening at (8,100,8)
            for (let x = 0; x < 16; x++) for (let z = 0; z < 16; z++) chunk.blocks[blockIndex(x, 100, z)] = STONE;
            chunk.blocks[blockIndex(8, 100, 8)] = AIR; // opening
            calculateChunkSunlight(chunk, 16, 320);
            // Light should propagate from opening into cave below
            expect(chunk.skyLight[blockIndex(8, 99, 8)]).toBeGreaterThan(1);
            // Nearby blocks should have some light from horizontal spread
            expect(chunk.skyLight[blockIndex(7, 99, 8)]).toBeGreaterThan(1);
        });
        it("skyLight array created if missing", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; calculateChunkSunlight(chunk, 16, 320); expect(chunk.skyLight).toBeInstanceOf(Uint8Array); expect(chunk.skyLight.length).toBe(CHUNK_DATA_SIZE); });
    });

    // ---- calculateBlockLight ----
    describe("calculateBlockLight", () => {
        it("torch emits level 14", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; chunk.blocks[blockIndex(8, 64, 8)] = TORCH; calculateBlockLight(chunk, 16, 320); expect(chunk.blockLight[blockIndex(8, 64, 8)]).toBe(14); });
        it("light propagates through air", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; chunk.blocks[blockIndex(8, 64, 8)] = TORCH; calculateBlockLight(chunk, 16, 320); expect(chunk.blockLight[blockIndex(9, 64, 8)]).toBe(13); expect(chunk.blockLight[blockIndex(10, 64, 8)]).toBe(12); });
        it("light blocked by solid", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; chunk.blocks[blockIndex(8, 64, 8)] = TORCH; chunk.blocks[blockIndex(9, 64, 8)] = STONE; calculateBlockLight(chunk, 16, 320);
            // Stone blocks direct path but light can wrap around via other neighbors
            // The block at (10,64,8) may still get light from (10,65,8) or (10,63,8) etc.
            // What we verify is that the stone itself has 0 light (not transparent)
            expect(chunk.blockLight[blockIndex(9, 64, 8)]).toBe(0); // Stone itself has no light
        });
        it("no light without torch", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; calculateBlockLight(chunk, 16, 320); for (let i = 0; i < 100; i++) expect(chunk.blockLight[blockIndex((Math.random()*16)|0, (Math.random()*320)|0, (Math.random()*16)|0)]).toBe(0); });
        it("light decays to 0 at range", () => { const chunk = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR) }; chunk.blocks[blockIndex(0, 64, 0)] = TORCH; calculateBlockLight(chunk, 16, 320); expect(chunk.blockLight[blockIndex(15, 64, 0)]).toBeLessThanOrEqual(1); });
    });

    // ---- analyzeChunkSections ----
    describe("analyzeChunkSections", () => {
        it("all-air chunk -> all empty", () => { const ch = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR), sections: createSectionData() }; analyzeChunkSections(ch); ch.sections.forEach(s => { expect(s.isEmpty).toBe(true); expect(s.isFullySolid).toBe(false); expect(s.analyzed).toBe(true); }); });
        it("detects non-empty section", () => { const ch = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR), sections: createSectionData() }; ch.blocks[blockIndex(5, 10, 5)] = STONE; analyzeChunkSections(ch); expect(ch.sections[0].isEmpty).toBe(false); expect(ch.sections[1].isEmpty).toBe(true); });
        it("tracks tight X/Z bounds", () => { const ch = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(AIR), sections: createSectionData() }; ch.blocks[blockIndex(3, 10, 7)] = STONE; ch.blocks[blockIndex(10, 12, 2)] = DIRT; analyzeChunkSections(ch); expect(ch.sections[0].minBlockX).toBe(3); expect(ch.sections[0].maxBlockX).toBe(10); expect(ch.sections[0].minBlockZ).toBe(2); expect(ch.sections[0].maxBlockZ).toBe(7); });
        it("fully solid detection", () => { const ch = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(STONE), sections: createSectionData() }; analyzeChunkSections(ch); ch.sections.forEach(s => { expect(s.isEmpty).toBe(false); expect(s.isFullySolid).toBe(true); }); });
        it("leaves break fullySolid", () => { const ch = { blocks: new Uint8Array(CHUNK_DATA_SIZE).fill(STONE), sections: createSectionData() }; ch.blocks[blockIndex(0, 0, 0)] = LEAVES; analyzeChunkSections(ch); expect(ch.sections[0].isFullySolid).toBe(false); });
    });

    // ---- computeTightChunkBounds ----
    describe("computeTightChunkBounds", () => {
        it("empty sections -> full chunk (with +1 extent)", () => { const b = computeTightChunkBounds(0, 0, createSectionData()); expect(b.minX).toBe(0); expect(b.maxX).toBe(17); expect(b.minY).toBe(0); expect(b.maxY).toBe(CHUNK_HEIGHT + 1); });
        it("tight bounds from section data", () => { const sec = createSectionData(); sec[2].isEmpty = false; sec[2].analyzed = true; sec[2].minBlockX = 3; sec[2].maxBlockX = 10; sec[2].minBlockY = 34; sec[2].maxBlockY = 40; sec[2].minBlockZ = 5; sec[2].maxBlockZ = 12;
            const b = computeTightChunkBounds(0, 0, sec); expect(b.minX).toBe(3); expect(b.maxX).toBe(11); expect(b.minY).toBe(34); expect(b.maxY).toBe(41); expect(b.minZ).toBe(5); expect(b.maxZ).toBe(13); });
        it("respects chunk offset", () => { const sec = createSectionData(); sec[0].isEmpty = false; sec[0].analyzed = true; sec[0].minBlockX = 0; sec[0].maxBlockX = 15; sec[0].minBlockY = 0; sec[0].maxBlockY = 15; sec[0].minBlockZ = 0; sec[0].maxBlockZ = 15;
            const b = computeTightChunkBounds(3, -2, sec); expect(b.minX).toBe(48); expect(b.minZ).toBe(-32); });
    });

    // ---- getPreRiverHeight / getLocalSlope ----
    describe("getPreRiverHeight", () => {
        it("deterministic", () => { biomeCellCache.clear(); const h1 = getPreRiverHeight(100, 100, workerNumericSeed); biomeCellCache.clear(); expect(getPreRiverHeight(100, 100, workerNumericSeed)).toBeCloseTo(h1, 5); });
        it("finite values", () => { for (let i = 0; i < 50; i++) { const h = getPreRiverHeight(i*100, i*73, workerNumericSeed); expect(isFinite(h)).toBeTruthy(); } });
    });
    describe("getLocalSlope", () => {
        it("non-negative", () => { for (let i = 0; i < 20; i++) expect(getLocalSlope(i*100, i*70, workerNumericSeed)).toBeGreaterThanOrEqual(0); });
        it("flat terrain has low slope", () => { // Plains area (near origin) should generally be flat
            const s = getLocalSlope(0, 0, workerNumericSeed);
            expect(s).toBeLessThan(5); // Blocks per block
        });
    });

    renderTerrainVisualizations();
    renderResults();
}

// ============================================================
// TERRAIN VISUALIZATION
// ============================================================
function renderTerrainVisualizations() {
    const container = document.getElementById('terrain-viz-container');
    container.innerHTML = '<h2 style="color:#4caf50;margin:16px 0 8px">Terrain Height Maps</h2><div class="terrain-viz" id="viz-row"></div>';
    const row = document.getElementById('viz-row');
    initNoise("test_seed_42"); const seed = workerNumericSeed; const sz = 128, sc = 2;
    const cfgs = [
        { name: "Plains", fn: plainsHeightFunc, biome: BIOME_CONFIG.plains },
        { name: "Hills", fn: hillsHeightFunc, biome: BIOME_CONFIG.hills },
        { name: "Forests", fn: defaultHeightFunc, biome: BIOME_CONFIG.forests },
        { name: "Mountains", fn: mountainsHeightFunc, biome: BIOME_CONFIG.mountains },
        { name: "Continental", fn: null },
        { name: "blendedHeight", fn: "blended" },
    ];
    for (const cfg of cfgs) {
        const wrapper = document.createElement('div'); const canvas = document.createElement('canvas');
        canvas.width = sz; canvas.height = sz; canvas.className = 'terrain-canvas';
        canvas.style.width = (sz * sc) + 'px'; canvas.style.height = (sz * sc) + 'px'; canvas.style.imageRendering = 'pixelated';
        const ctx = canvas.getContext('2d'); const img = ctx.createImageData(sz, sz);
        let mn = Infinity, mx = -Infinity; const hs = new Float32Array(sz * sz);
        biomeCellCache.clear();
        for (let z = 0; z < sz; z++) for (let x = 0; x < sz; x++) {
            const gx = (x - sz/2) * 4, gz = (z - sz/2) * 4;
            let h; if (cfg.fn === null) h = continentalHeight(gx, gz, seed); else if (cfg.fn === "blended") h = blendedHeight(gx, gz, seed); else h = cfg.fn(gx, gz, cfg.biome, seed);
            hs[z * sz + x] = h; mn = Math.min(mn, h); mx = Math.max(mx, h);
        }
        const range = mx - mn || 1;
        for (let z = 0; z < sz; z++) for (let x = 0; x < sz; x++) {
            const t = (hs[z * sz + x] - mn) / range; const i = (z * sz + x) * 4;
            if (cfg.fn === null) { if (t < 0.5) { img.data[i]=20; img.data[i+1]=40+t*200; img.data[i+2]=120+t*200; } else { const lt=(t-0.5)/0.5; img.data[i]=40+lt*100; img.data[i+1]=100+lt*80; img.data[i+2]=30; } }
            else if (cfg.fn === "blended") { const h = hs[z*sz+x]; if (h <= WORLD_DIMS.seaLevel) { img.data[i]=20; img.data[i+1]=60; img.data[i+2]=140; } else { const lt = Math.min(1, (h - WORLD_DIMS.seaLevel)/200); img.data[i]=40+lt*160; img.data[i+1]=120+lt*100; img.data[i+2]=30+lt*30; } }
            else { const v = Math.floor(t * 220 + 20); img.data[i]=Math.floor(v*0.6); img.data[i+1]=v; img.data[i+2]=Math.floor(v*0.5); }
            img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        const label = document.createElement('div'); label.className = 'terrain-label'; label.textContent = `${cfg.name} (${mn.toFixed(1)} - ${mx.toFixed(1)})`;
        wrapper.appendChild(canvas); wrapper.appendChild(label); row.appendChild(wrapper);
    }
}
