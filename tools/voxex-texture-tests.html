<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VoxEx Texture Visual Tests</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', monospace; background: #1a1a1a; color: #eee; padding: 20px; }
h1 { color: #4caf50; margin-bottom: 4px; }
h2 { color: #66bb6a; margin: 24px 0 12px; border-bottom: 1px solid #333; padding-bottom: 4px; }
.subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
.tile-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
.tile-card { background: #222; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #333; }
.tile-card canvas { image-rendering: pixelated; border: 1px solid #555; display: block; margin: 0 auto 8px; }
.tile-card .label { font-size: 13px; color: #aaa; }
.tile-card .id { font-size: 11px; color: #666; }
.atlas-section { margin-bottom: 24px; }
.atlas-section canvas { image-rendering: pixelated; border: 1px solid #555; display: block; }
.controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
.controls select, .controls button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.controls button { background: #4caf50; border-color: #4caf50; }
.controls button:hover { background: #66bb6a; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 12px 0; }
.check-item { background: #222; padding: 8px 12px; border-radius: 4px; font-size: 13px; }
.check-item.pass { border-left: 3px solid #4caf50; color: #81c784; }
.check-item.fail { border-left: 3px solid #f44336; color: #ef5350; }
.checker-bg { background: repeating-conic-gradient(#444 0% 25%, #333 0% 50%) 50% / 16px 16px; }
</style>
</head>
<body>
<h1>VoxEx Texture Visual Tests</h1>
<p class="subtitle">Visual inspection + automated checks for this page's 25-tile local texture set (independently numbered — the game's real atlas is <code>NUM_TILES</code> = 40)</p>

<div class="controls">
    <label>Resolution: <select id="res-select"><option value="8">8x8</option><option value="16" selected>16x16</option><option value="32">32x32</option></select></label>
    <label>Zoom: <select id="zoom-select"><option value="4">4x</option><option value="8" selected>8x</option><option value="12">12x</option><option value="16">16x</option></select></label>
    <button onclick="regenerate()">Regenerate</button>
</div>

<h2>Full Atlas</h2>
<div class="atlas-section" id="atlas-container"></div>

<h2>Individual Tiles (zoom)</h2>
<div class="tile-grid" id="tile-grid"></div>

<h2>Automated Checks</h2>
<div class="check-grid" id="check-results"></div>

<script>
// ============================================================
// CONSTANTS (from voxEx.html)
// ============================================================
const TILE = {
    GRASS_TOP: 0, GRASS_SIDE: 1, DIRT: 2, STONE: 3, PLANK: 4,
    LOG_SIDE: 5, LEAF: 6, BEDROCK: 7, LOG_TOP: 8, SAND: 9,
    WATER: 10, TORCH: 11, SNOW: 12, GRAVEL: 13,
    LONGWOOD_LOG_SIDE: 14, LONGWOOD_LOG_TOP: 15, LONGWOOD_LEAF: 16, GLASS: 17,
    // NOTE: this standalone test atlas never tracked the FIRE (12 frames) / BURNT_*
    // (3 tiles) additions that shipped in voxEx.html (real atlas: GLASS=17, then
    // fire/burnt occupy 18-32, spell icons are 33-35, ICE is 36). Those real indices
    // don't apply here — this file's mini-atlas simply appends the magic-system
    // tiles (magicSystem.md Phase 0 icons + Phase 1 ICE) at its own next available slots.
    ICON_EXPLOSION: 18, ICON_LASER: 19, ICON_FREEZE: 20,
    ICE: 21,
    // CCR-MAGIC-006 C3: cracked-block variants, appended at this file's own next slots
    // (same "independently numbered" convention as the magic-system tiles above — the
    // real atlas indices 37-39 don't apply here).
    CRACKED_STONE: 22, CRACKED_DIRT: 23, CRACKED_PLANKS: 24,
};
const TILE_NAMES = Object.entries(TILE).reduce((acc, [k, v]) => { acc[v] = k; return acc; }, {});
const NUM_TILES = 25;
const TRANSPARENT_TILES = new Set([TILE.LEAF, TILE.LONGWOOD_LEAF, TILE.GLASS]);

// Block type IDs
const AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, WOOD = 4, LOG = 5, LEAVES = 6;
const BEDROCK = 7, SAND = 8, WATER = 9, TORCH = 10, SNOW = 11, GRAVEL = 12;
const LONGWOOD_LOG = 13, LONGWOOD_LEAVES = 14, GLASS = 15;

const BLOCK_CONFIG = [
    { id: AIR, key: "air", name: "Air", tags: ["transparent"], textures: null, ui: { showInInventory: false } },
    { id: GRASS, key: "grass", name: "Grass", tags: ["solid"], textures: { top: TILE.GRASS_TOP, side: TILE.GRASS_SIDE, bottom: TILE.DIRT }, ui: { showInInventory: true, tileIndex: TILE.GRASS_SIDE } },
    { id: DIRT, key: "dirt", name: "Dirt", tags: ["solid"], textures: { all: TILE.DIRT }, ui: { showInInventory: true, tileIndex: TILE.DIRT } },
    { id: STONE, key: "stone", name: "Stone", tags: ["solid"], textures: { all: TILE.STONE }, ui: { showInInventory: true, tileIndex: TILE.STONE } },
    { id: WOOD, key: "wood", name: "Wood", tags: ["solid"], textures: { all: TILE.PLANK }, ui: { showInInventory: true, tileIndex: TILE.PLANK } },
    { id: LOG, key: "log", name: "Log", tags: ["solid", "log"], textures: { top: TILE.LOG_TOP, side: TILE.LOG_SIDE, bottom: TILE.LOG_TOP }, ui: { showInInventory: true, tileIndex: TILE.LOG_SIDE } },
    { id: LEAVES, key: "leaves", name: "Leaves", tags: ["transparent", "leaves"], textures: { all: TILE.LEAF }, ui: { showInInventory: true, tileIndex: TILE.LEAF } },
    { id: BEDROCK, key: "bedrock", name: "Bedrock", tags: ["solid"], textures: { all: TILE.BEDROCK }, ui: { showInInventory: false } },
    { id: SAND, key: "sand", name: "Sand", tags: ["solid"], textures: { all: TILE.SAND }, ui: { showInInventory: true, tileIndex: TILE.SAND } },
    { id: WATER, key: "water", name: "Water", tags: ["transparent", "fluid"], textures: { all: TILE.WATER }, ui: { showInInventory: true, tileIndex: TILE.WATER } },
    { id: TORCH, key: "torch", name: "Torch", tags: ["transparent", "emissive"], textures: { all: TILE.TORCH }, ui: { showInInventory: true, tileIndex: TILE.TORCH } },
    { id: SNOW, key: "snow", name: "Snow", tags: ["solid"], textures: { all: TILE.SNOW }, ui: { showInInventory: true, tileIndex: TILE.SNOW } },
    { id: GRAVEL, key: "gravel", name: "Gravel", tags: ["solid"], textures: { all: TILE.GRAVEL }, ui: { showInInventory: true, tileIndex: TILE.GRAVEL } },
    { id: LONGWOOD_LOG, key: "longwood_log", name: "Longwood Log", tags: ["solid", "log"], textures: { top: TILE.LONGWOOD_LOG_TOP, side: TILE.LONGWOOD_LOG_SIDE, bottom: TILE.LONGWOOD_LOG_TOP }, ui: { showInInventory: true, tileIndex: TILE.LONGWOOD_LOG_SIDE } },
    { id: LONGWOOD_LEAVES, key: "longwood_leaves", name: "Longwood Leaves", tags: ["transparent", "leaves"], textures: { all: TILE.LONGWOOD_LEAF }, ui: { showInInventory: true, tileIndex: TILE.LONGWOOD_LEAF } },
    { id: GLASS, key: "glass", name: "Glass", tags: ["transparent", "cutout", "collidable"], textures: { all: TILE.GLASS }, ui: { showInInventory: true, tileIndex: TILE.GLASS } },
];

// ============================================================
// TEXTURE GENERATION (extracted from voxEx.html initTextures)
// ============================================================
function generateAtlas(PIXELS_PER_TILE) {
    const TILE_SIZE = PIXELS_PER_TILE * 4;
    const cvs = document.createElement("canvas");
    cvs.width = NUM_TILES * TILE_SIZE;
    cvs.height = TILE_SIZE;
    const ctx = cvs.getContext("2d");
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    const STEP = TILE_SIZE / PIXELS_PER_TILE;
    function fillLogicalPixel(tileX, gx, gy, color) { ctx.fillStyle = color; ctx.fillRect(tileX + gx * STEP, gy * STEP, STEP, STEP); }

    class SeededRNG { constructor(seed) { this.seed = seed; } next() { this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff; return this.seed / 0x7fffffff; } }

    function beginTile(tileX, baseColor) { ctx.fillStyle = baseColor; ctx.fillRect(tileX, 0, TILE_SIZE, TILE_SIZE); }

    // --- Palettes ---
    const OAK_PALETTE = { barkBase:"#5D4037", barkDark:"#4E342E", barkGroove:"#281814", barkGrooveEdge:"#3E2723", barkHighlight:"#795548", barkHighlight2:"#8D6E63", woodBase:"#C19A6B", woodRing:"#8B5A2B", woodCenter:"#A6764A", woodNoise:"#A17E55", woodBark:"#5D4037", woodBarkDark:"#3E2723", ringSpacing:4, ringThreshold:0.65 };
    const LONGWOOD_PALETTE = { barkBase:"#3D2A1F", barkDark:"#2A1A12", barkGroove:"#1A0F08", barkGrooveEdge:"#2D1810", barkHighlight:"#5A4030", barkHighlight2:"#6B5040", woodBase:"#8B6B50", woodRing:"#4A3020", woodCenter:"#6B5040", woodNoise:"#7A5A40", woodBark:"#3D2A1F", woodBarkDark:"#2A1A12", ringSpacing:2, ringThreshold:0.50 };

    function drawLogSide(tileX, p, rng) {
        beginTile(tileX, p.barkBase);
        for (let y=0;y<PIXELS_PER_TILE;y++) for (let x=0;x<PIXELS_PER_TILE;x++) fillLogicalPixel(tileX,x,y,rng.next()>0.5?p.barkBase:p.barkDark);
        const ng=Math.floor(PIXELS_PER_TILE/3);
        for (let g=0;g<ng;g++){let x=Math.floor(rng.next()*PIXELS_PER_TILE);for(let y=0;y<PIXELS_PER_TILE;y++){fillLogicalPixel(tileX,(x-1+PIXELS_PER_TILE)%PIXELS_PER_TILE,y,p.barkGrooveEdge);fillLogicalPixel(tileX,(x+1)%PIXELS_PER_TILE,y,p.barkGrooveEdge);fillLogicalPixel(tileX,x,y,p.barkGroove);const w=rng.next();if(w<0.2)x--;else if(w>0.8)x++;if(x<0)x=PIXELS_PER_TILE-1;if(x>=PIXELS_PER_TILE)x=0;if(rng.next()>0.9)y++;}}
        const hc=Math.floor((PIXELS_PER_TILE*PIXELS_PER_TILE)/2);
        for(let i=0;i<hc;i++){const x=Math.floor(rng.next()*PIXELS_PER_TILE),y=Math.floor(rng.next()*PIXELS_PER_TILE);if(rng.next()>0.75)fillLogicalPixel(tileX,x,y,rng.next()>0.5?p.barkHighlight:p.barkHighlight2);}
    }
    function drawLogTop(tileX, p, rng) {
        beginTile(tileX, p.woodBase);
        const center=(PIXELS_PER_TILE-1)/2;
        for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){const dx=x-center,dy=y-center,dist=Math.sqrt(dx*dx+dy*dy);let col=p.woodBase;if(dist>=center-1){col=p.woodBark;if(rng.next()>0.5)col=p.woodBarkDark;}else{if((dist/p.ringSpacing)%1>p.ringThreshold)col=p.woodRing;if(dist<1.5)col=p.woodCenter;if(rng.next()>0.85)col=col===p.woodBase?p.woodNoise:p.woodBase;}fillLogicalPixel(tileX,x,y,col);}
    }

    const grassNoiseCount = (PIXELS_PER_TILE*PIXELS_PER_TILE)/4;
    const dirtClumpCount = (PIXELS_PER_TILE*PIXELS_PER_TILE)/2;
    const dirtHighlightCount = (PIXELS_PER_TILE*PIXELS_PER_TILE)/8;
    const dirtGritCount = (PIXELS_PER_TILE*PIXELS_PER_TILE)/6;
    const grassSideHeight = Math.floor(PIXELS_PER_TILE*0.25);
    const dirtColors = { base:"#5d4037", shadow:"#3e2723", highlight:"#8d6e63", grit:"#795548" };

    // Tile 0: Grass Top
    let lf = 0;
    for(let y=0;y<PIXELS_PER_TILE;y++) for(let x=0;x<PIXELS_PER_TILE;x++) fillLogicalPixel(lf,x,y,Math.random()>0.4?"#378a32":"#2c6b2f");
    for(let i=0;i<grassNoiseCount;i++){const x=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),y=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),col=Math.random()>0.5?"#266e2c":"#4caf50";fillLogicalPixel(lf,x,y,col);if(Math.random()>0.5){if(Math.random()>0.5)fillLogicalPixel(lf,x,y+1,col);else fillLogicalPixel(lf,x+1,y,col);}}

    // Tile 1: Grass Side
    lf += TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++) for(let x=0;x<PIXELS_PER_TILE;x++){if(y<grassSideHeight)fillLogicalPixel(lf,x,y,Math.random()>0.3?"#378a32":"#2c6b2f");else fillLogicalPixel(lf,x,y,dirtColors.shadow);}
    for(let i=0;i<dirtClumpCount*0.8;i++){const x=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),y=grassSideHeight+Math.floor(Math.random()*(PIXELS_PER_TILE-grassSideHeight-1));fillLogicalPixel(lf,x,y,dirtColors.base);if(Math.random()>0.4)fillLogicalPixel(lf,x+1,y,dirtColors.base);if(Math.random()>0.4&&y+1<PIXELS_PER_TILE)fillLogicalPixel(lf,x,y+1,dirtColors.base);}
    for(let i=0;i<dirtHighlightCount*0.8;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),grassSideHeight+Math.floor(Math.random()*(PIXELS_PER_TILE-grassSideHeight)),dirtColors.highlight);
    for(let i=0;i<dirtGritCount*0.8;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),grassSideHeight+Math.floor(Math.random()*(PIXELS_PER_TILE-grassSideHeight)),dirtColors.grit);
    const seedCount=Math.max(2,Math.floor((PIXELS_PER_TILE/16)*4)),maxDripLen=Math.max(3,Math.floor(PIXELS_PER_TILE/6));
    for(let s=0;s<seedCount;s++){let x=Math.floor(Math.random()*PIXELS_PER_TILE);const dc=Math.random()<0.5?"#378a32":"#2c6b2f";const tw=Math.max(1,Math.floor(PIXELS_PER_TILE/32));for(let tx=-tw;tx<=tw;tx++){fillLogicalPixel(lf,(x+tx+PIXELS_PER_TILE)%PIXELS_PER_TILE,grassSideHeight,dc);if(grassSideHeight+1<PIXELS_PER_TILE&&Math.random()<0.5)fillLogicalPixel(lf,(x+tx+PIXELS_PER_TILE)%PIXELS_PER_TILE,grassSideHeight+1,dc);}const dl=1+Math.floor(Math.random()*maxDripLen);let cx=x;for(let d=0;d<dl;d++){const y=grassSideHeight+d;if(y>=PIXELS_PER_TILE)break;fillLogicalPixel(lf,cx,y,dc);if(Math.random()<0.6)fillLogicalPixel(lf,(cx+(Math.random()<0.5?-1:1)+PIXELS_PER_TILE)%PIXELS_PER_TILE,y,dc);if(Math.random()<0.3){cx+=Math.random()<0.5?-1:1;if(cx<0)cx=PIXELS_PER_TILE-1;if(cx>=PIXELS_PER_TILE)cx=0;}if(d>1&&Math.random()<0.25)break;}}

    // Tile 2: Dirt
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,dirtColors.shadow);
    for(let i=0;i<dirtClumpCount;i++){const x=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),y=Math.floor(Math.random()*(PIXELS_PER_TILE-1));fillLogicalPixel(lf,x,y,dirtColors.base);if(Math.random()>0.3)fillLogicalPixel(lf,x+1,y,dirtColors.base);if(Math.random()>0.3)fillLogicalPixel(lf,x,y+1,dirtColors.base);}
    for(let i=0;i<dirtHighlightCount;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),dirtColors.highlight);
    for(let i=0;i<dirtGritCount;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),dirtColors.grit);

    // Tile 3: Stone
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){const r=Math.random();fillLogicalPixel(lf,x,y,r>0.6?"#858585":r>0.9?"#757575":"#9e9e9e");}
    const fc=Math.floor((PIXELS_PER_TILE*PIXELS_PER_TILE)/8);for(let i=0;i<fc;i++){const x=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),y=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),r=Math.random();let c="#6b6a6a";if(r>0.5)c="#505050";if(r>0.85)c="#78909c";fillLogicalPixel(lf,x,y,c);if(Math.random()>0.5)fillLogicalPixel(lf,x+1,y,c);else if(Math.random()>0.5)fillLogicalPixel(lf,x,y+1,c);}

    // Tile 4: Wood Planks
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,"#C19A6B");
    const nd=PIXELS_PER_TILE*PIXELS_PER_TILE*4;for(let i=0;i<nd;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),Math.random()>0.7?"#a17e55":"#c9a77d");
    const PH=Math.floor(PIXELS_PER_TILE/4),GS=Math.max(1,Math.floor(PIXELS_PER_TILE/32));for(let row=PH-GS;row<PIXELS_PER_TILE;row+=PH)for(let g=0;g<GS;g++)for(let x=0;x<PIXELS_PER_TILE;x++){const r=Math.random();fillLogicalPixel(lf,x,row+g,r>0.7?"#6D4C41":r>0.9?"#5D4037":"#8B5A2B");}

    // Tile 5: Oak Log Side
    lf+=TILE_SIZE; beginTile(lf,"#5D4037");
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,Math.random()>0.5?"#5D4037":"#4E342E");
    const ng=Math.floor(PIXELS_PER_TILE/3);for(let g=0;g<ng;g++){let x=Math.floor(Math.random()*PIXELS_PER_TILE);for(let y=0;y<PIXELS_PER_TILE;y++){fillLogicalPixel(lf,(x-1+PIXELS_PER_TILE)%PIXELS_PER_TILE,y,"#3E2723");fillLogicalPixel(lf,(x+1)%PIXELS_PER_TILE,y,"#3E2723");fillLogicalPixel(lf,x,y,"#281814");const w=Math.random();if(w<0.2)x--;else if(w>0.8)x++;if(x<0)x=PIXELS_PER_TILE-1;if(x>=PIXELS_PER_TILE)x=0;if(Math.random()>0.9)y++;}}
    const bnc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/2;for(let i=0;i<bnc;i++){const x=Math.floor(Math.random()*PIXELS_PER_TILE),y=Math.floor(Math.random()*PIXELS_PER_TILE);if(Math.random()>0.75)fillLogicalPixel(lf,x,y,Math.random()>0.5?"#795548":"#8D6E63");}

    // Tile 6: Leaves (with transparency)
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)ctx.clearRect(lf+x*STEP,y*STEP,STEP,STEP);
    const ld=PIXELS_PER_TILE*PIXELS_PER_TILE*1.2;for(let i=0;i<ld;i++){const x=Math.floor(Math.random()*PIXELS_PER_TILE),y=Math.floor(Math.random()*PIXELS_PER_TILE),r=Math.random();let c="#2E7D32";if(r>0.7)c="#4CAF50";else if(r<0.4)c="#1B5E20";fillLogicalPixel(lf,x,y,c);if(Math.random()>0.5)fillLogicalPixel(lf,x+1,y,c);}
    const gc=Math.floor(Math.sqrt(PIXELS_PER_TILE)*1.5),mr=Math.max(2,PIXELS_PER_TILE/10);for(let i=0;i<gc;i++){const cx=Math.floor(Math.random()*PIXELS_PER_TILE),cy=Math.floor(Math.random()*PIXELS_PER_TILE),sz=1+Math.random()*(mr-1);for(let y=Math.floor(cy-sz);y<=Math.floor(cy+sz);y++){if(y<0||y>=PIXELS_PER_TILE)continue;for(let x=Math.floor(cx-sz);x<=Math.floor(cx+sz);x++){if(x<0||x>=PIXELS_PER_TILE)continue;if((x-cx)**2+(y-cy)**2<=sz*sz&&Math.random()>0.2)ctx.clearRect(lf+x*STEP,y*STEP,STEP,STEP);}}}

    // Tile 7: Bedrock
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){const r=Math.random();fillLogicalPixel(lf,x,y,r>0.8?"#555555":r>0.6?"#2b2b2b":"#1a1a1a");}
    const rc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/5;for(let i=0;i<rc;i++){const x=Math.floor(Math.random()*PIXELS_PER_TILE),y=Math.floor(Math.random()*PIXELS_PER_TILE),c=Math.random()>0.5?"#777777":"#000000";fillLogicalPixel(lf,x,y,c);if(Math.random()>0.5)fillLogicalPixel(lf,x+(Math.random()>0.5?1:-1),y+(Math.random()>0.5?1:-1),c);}
    const sc2=(PIXELS_PER_TILE*PIXELS_PER_TILE)/16;for(let i=0;i<sc2;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),"#999999");

    // Tile 8: Oak Log Top
    lf+=TILE_SIZE;
    const ct=(PIXELS_PER_TILE-1)/2;for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,"#C19A6B");
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){const dx=x-ct,dy=y-ct,dist=Math.sqrt(dx*dx+dy*dy);let c="#C19A6B";if(dist>=ct-1){c="#5D4037";if(Math.random()>0.5)c="#3E2723";}else{if((dist/4)%1>0.65)c="#8B5A2B";if(dist<1.5)c="#A6764A";if(Math.random()>0.85)c=c==="#C19A6B"?"#A17E55":"#C19A6B";}fillLogicalPixel(lf,x,y,c);}

    // Tile 9: Sand
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,y<PIXELS_PER_TILE/2?"#E6D6AC":"#DECFA3");
    const sgc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/3;for(let i=0;i<sgc;i++){const x=Math.floor(Math.random()*PIXELS_PER_TILE),y=Math.floor(Math.random()*PIXELS_PER_TILE),r=Math.random();fillLogicalPixel(lf,x,y,r>0.8?"#F2E6C9":r>0.6?"#C2B280":"#D4C08E");}
    const wc=Math.max(2,Math.floor(PIXELS_PER_TILE/8));for(let w=0;w<wc;w++){const wy=2+Math.floor(Math.random()*(PIXELS_PER_TILE-4));for(let x=0;x<PIXELS_PER_TILE;x++)if(Math.random()>0.7)fillLogicalPixel(lf,x,wy,"#D1C296");}

    // Tile 10: Water
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,y<PIXELS_PER_TILE/2?"#2389DA":"#1B609E");
    const rpc=Math.floor(PIXELS_PER_TILE/2);for(let i=0;i<rpc;i++){const y=Math.floor(Math.random()*PIXELS_PER_TILE),len=Math.floor(PIXELS_PER_TILE*0.2+Math.random()*(PIXELS_PER_TILE*0.3)),sx=Math.floor(Math.random()*PIXELS_PER_TILE);for(let k=0;k<len;k++){fillLogicalPixel(lf,(sx+k)%PIXELS_PER_TILE,y,"#4FC3F7");if(y+1<PIXELS_PER_TILE)fillLogicalPixel(lf,(sx+k)%PIXELS_PER_TILE,y+1,"#1565C0");}}
    const skc=Math.floor(PIXELS_PER_TILE/4);for(let i=0;i<skc;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),"#E1F5FE");

    // Tile 11: Torch
    lf+=TILE_SIZE;
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,"#808080");
    const cX=Math.floor(PIXELS_PER_TILE/2),tw2=Math.max(2,Math.floor(PIXELS_PER_TILE/8)),thh=Math.floor(PIXELS_PER_TILE*0.6),fh=Math.floor(PIXELS_PER_TILE*0.35);
    for(let y=PIXELS_PER_TILE-thh;y<PIXELS_PER_TILE;y++)for(let x=cX-Math.floor(tw2/2);x<=cX+Math.floor(tw2/2);x++)fillLogicalPixel(lf,x,y,"#8b4513");
    const fsy=PIXELS_PER_TILE-thh-fh;for(let y=fsy;y<PIXELS_PER_TILE-thh;y++)for(let x=cX-Math.floor(tw2/2);x<=cX+Math.floor(tw2/2);x++)fillLogicalPixel(lf,x,y,(y-fsy)/fh<0.5?"#ffeb3b":"#ff9800");

    // Tile 12: Snow
    lf+=TILE_SIZE;
    const snb=["#FAFAFA","#F5F5F5","#EEEEEE"],sns=["#E0E0E0","#D6E6F2","#CFE2F3"];
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,snb[Math.floor(Math.random()*3)]);
    const snsc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/4;for(let i=0;i<snsc;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),sns[Math.floor(Math.random()*3)]);
    const snsk=(PIXELS_PER_TILE*PIXELS_PER_TILE)/6;for(let i=0;i<snsk;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),"#FFFFFF");

    // Tile 13: Gravel
    lf+=TILE_SIZE;
    const gbc=["#6B6B6B","#787878","#5C5C5C"],gac=["#8B8B8B","#4A4A4A","#9E9E9E","#707070"];
    for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++)fillLogicalPixel(lf,x,y,gbc[Math.floor(Math.random()*3)]);
    const gpc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/3;for(let i=0;i<gpc;i++){const x=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),y=Math.floor(Math.random()*(PIXELS_PER_TILE-1)),ac=gac[Math.floor(Math.random()*4)];fillLogicalPixel(lf,x,y,ac);if(Math.random()>0.5){if(Math.random()>0.5)fillLogicalPixel(lf,x+1,y,ac);else fillLogicalPixel(lf,x,y+1,ac);}}
    const gdc=(PIXELS_PER_TILE*PIXELS_PER_TILE)/8;for(let i=0;i<gdc;i++)fillLogicalPixel(lf,Math.floor(Math.random()*PIXELS_PER_TILE),Math.floor(Math.random()*PIXELS_PER_TILE),"#3D3D3D");

    // Tile 14: Longwood Log Side
    lf+=TILE_SIZE; drawLogSide(lf, LONGWOOD_PALETTE, new SeededRNG(12345+14));

    // Tile 15: Longwood Log Top
    lf+=TILE_SIZE; drawLogTop(lf, LONGWOOD_PALETTE, new SeededRNG(12345+15));

    // Tile 16: Longwood Leaf (transparent)
    lf+=TILE_SIZE;
    {const lr=new SeededRNG(12345+16);ctx.clearRect(lf,0,TILE_SIZE,TILE_SIZE);for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){if(lr.next()<0.35)continue;const r=lr.next();let c;if(r<0.35)c="#1B4F1B";else if(r<0.65)c="#2A6A2A";else if(r<0.85)c="#3A7A3A";else c="#0F3F0F";fillLogicalPixel(lf,x,y,c);}}

    // Tile 17: Glass (transparent center, pale border frame, glint specks)
    lf+=TILE_SIZE;
    {
        const gr=new SeededRNG(12345+17);ctx.clearRect(lf,0,TILE_SIZE,TILE_SIZE);
        const last=PIXELS_PER_TILE-1;
        for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){
            const onBorder=x===0||y===0||x===last||y===last;
            if(onBorder){const corner=(x===0||x===last)&&(y===0||y===last);fillLogicalPixel(lf,x,y,corner?"#9fc4cf":"#cfe8ef");}
            else if(gr.next()<0.05){fillLogicalPixel(lf,x,y,"#e8f7fb");}
        }
        // diagonal streak (bounds-guarded for low resolutions)
        for(const [sx,sy] of [[12,2],[11,3],[10,4],[9,5]]){if(sx<last&&sy<last)fillLogicalPixel(lf,sx,sy,"#e8f7fb");}
    }

    // Tile 18: Magic - Explosion icon (8-ray starburst, opaque; magicSystem.md Phase 0)
    lf+=TILE_SIZE;
    {
        const cx=(PIXELS_PER_TILE-1)/2, cy=(PIXELS_PER_TILE-1)/2;
        const rw=Math.max(0.6,PIXELS_PER_TILE*0.05), rmax=PIXELS_PER_TILE*0.47;
        for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){
            const dx=x-cx, dy=y-cy, dist=Math.max(Math.abs(dx),Math.abs(dy));
            const onRay=Math.abs(dx)<=rw||Math.abs(dy)<=rw||Math.abs(Math.abs(dx)-Math.abs(dy))<=rw;
            let col="#241208";

    // Tile 19: Magic - Laser icon (jagged vertical energy bolt, opaque)
    lf+=TILE_SIZE;
    {
        const ZIGZAG=[0,1,2,1], centerX=(PIXELS_PER_TILE-1)/2;
        for(let y=0;y<PIXELS_PER_TILE;y++){
            const bandCenter=centerX+ZIGZAG[y%ZIGZAG.length]-1;
            for(let x=0;x<PIXELS_PER_TILE;x++){
                const d=Math.abs(x-bandCenter);
                let col="#071820";
                if(d<=PIXELS_PER_TILE*0.06) col="#eafcff";
                else if(d<=PIXELS_PER_TILE*0.14) col="#7ff0ff";
                else if(d<=PIXELS_PER_TILE*0.22) col="#44e0ff";
                fillLogicalPixel(lf,x,y,col);
            }
        }
    }

    // Tile 20: Magic - Freeze icon (8-point snowflake with branch nubs, opaque)
    lf+=TILE_SIZE;
    {
        const cx=(PIXELS_PER_TILE-1)/2, cy=(PIXELS_PER_TILE-1)/2;
        const aw=Math.max(0.6,PIXELS_PER_TILE*0.04), amax=PIXELS_PER_TILE*0.45;
        for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){
            const dx=x-cx, dy=y-cy, dist=Math.max(Math.abs(dx),Math.abs(dy));
            const onArm=Math.abs(dx)<=aw||Math.abs(dy)<=aw||Math.abs(Math.abs(dx)-Math.abs(dy))<=aw;
            let col="#0c2430";
            if(onArm&&dist<=amax) col = dist<PIXELS_PER_TILE*0.06?"#ffffff":dist<PIXELS_PER_TILE*0.26?"#cdf3ff":"#9fe8ff";
            fillLogicalPixel(lf,x,y,col);
        }
        const bd=Math.round(PIXELS_PER_TILE*0.3);
        for(const [nx,ny] of [[cx+bd,cy],[cx-bd,cy],[cx,cy+bd],[cx,cy-bd]]){
            const bx=Math.round(nx), by=Math.round(ny);
            if(bx<0||bx>=PIXELS_PER_TILE||by<0||by>=PIXELS_PER_TILE) continue;
            const perpX=(Math.abs(bx-cx)<Math.abs(by-cy))?1:0, perpY=perpX?0:1;

    lf+=TILE_SIZE;
    {
        const ir=new SeededRNG(12345+21);
        const last=PIXELS_PER_TILE-1;
        for(let y=0;y<PIXELS_PER_TILE;y++)for(let x=0;x<PIXELS_PER_TILE;x++){
            const onBorder=x===0||y===0||x===last||y===last;
            if(onBorder){const corner=(x===0||x===last)&&(y===0||y===last);fillLogicalPixel(lf,x,y,corner?"#8fc3d6":"#d8f2fa");}
            else fillLogicalPixel(lf,x,y,ir.next()<0.08?"#f2fbff":"#bfe3f0");
        }
        for(let i=0;i<PIXELS_PER_TILE;i++){const x=i,y=last-i;if(x>1&&x<last-1&&y>1&&y<last-1)fillLogicalPixel(lf,x,y,"#8fc3d6");}
    }

    // CCR-MAGIC-007 B1 (replaces CCR-MAGIC-006 C3's random-walk version): Cracked Stone /
    // Cracked Dirt / Cracked Planks -- each is the base tile's own generator (copied from
    // Tiles 2-4 above) with an "epicenter web" crack overlay stamped on top (mirrors the real
    // voxEx.html drawCrackOverlay -- see that function's own doc comment for the algorithm).
    function drawCrackOverlay(tileX, seed) {
        const P = PIXELS_PER_TILE;
        const rng = new SeededRNG(seed);
        const CORE = "#2e2b28", CORE_DEEP = "#1c1a18", HALO = "#8a857f";
        const coreSet = new Set();
        const savedAlpha = ctx.globalAlpha;

        function walkArm(x, y, heading, steps) {
            let h = heading;
            for (let s = 0; s < steps; s++) {
                h += (rng.next() - 0.5) * 0.6;
                x = Math.max(0, Math.min(P - 1, Math.round(x + Math.cos(h))));
                y = Math.max(0, Math.min(P - 1, Math.round(y + Math.sin(h))));
                const key = x + "," + y;
                if (!coreSet.has(key)) {
                    coreSet.add(key);
                    ctx.globalAlpha = 0.8;
                    fillLogicalPixel(tileX, x, y, (s % 3 === 0) ? CORE_DEEP : CORE);
                }
            }
        }

        try {
            const epicenterCount = 1 + Math.floor(rng.next() * 2);
            for (let e = 0; e < epicenterCount; e++) {
                const cx = Math.floor(P * 0.25 + rng.next() * P * 0.5);
                const cy = Math.floor(P * 0.25 + rng.next() * P * 0.5);
                const armCount = 4 + Math.floor(rng.next() * 3);
                for (let a = 0; a < armCount; a++) {
                    const heading = (Math.PI * 2 * a) / armCount + (rng.next() - 0.5) * 0.8;
                    walkArm(cx, cy, heading, 4 + Math.floor(rng.next() * 5));
                    if (rng.next() < 0.4) {
                        const forkHeading = heading + (rng.next() < 0.5 ? 1 : -1) * (0.6 + rng.next() * 0.6);
                        walkArm(cx, cy, forkHeading, 2 + Math.floor(rng.next() * 3));
                    }
                }
            }
            ctx.globalAlpha = 0.30;
            const haloSet = new Set();
            for (const key of coreSet) {
                const kp = key.split(",");
                const kx = Number(kp[0]), ky = Number(kp[1]);
                const neighbors = [[kx + 1, ky], [kx - 1, ky], [kx, ky + 1], [kx, ky - 1]];
                for (const [nx, ny] of neighbors) {
                    if (nx < 0 || nx >= P || ny < 0 || ny >= P) continue;
                    const nkey = nx + "," + ny;
                    if (coreSet.has(nkey) || haloSet.has(nkey)) continue;
                    haloSet.add(nkey);
                    fillLogicalPixel(tileX, nx, ny, HALO);
                }
            }
        } finally {
            ctx.globalAlpha = savedAlpha;
        }
    }

    // preCrack: a snapshot of each cracked tile's base texture taken JUST BEFORE
    // drawCrackOverlay stamps it, so runChecks can verify the overlay actually changed pixels
    // instead of inferring it from luminance alone (some base materials already have dark
    // flecks/grain darker than any luminance threshold would catch as "the overlay's doing").
    const preCrack = {};

    // Tile 22: Cracked Stone
    lf += TILE_SIZE;
    for (let y = 0; y < PIXELS_PER_TILE; y++) for (let x = 0; x < PIXELS_PER_TILE; x++) { const r = Math.random(); fillLogicalPixel(lf, x, y, r > 0.6 ? "#858585" : r > 0.9 ? "#757575" : "#9e9e9e"); }
    for (let i = 0; i < fc; i++) { const x = Math.floor(Math.random() * (PIXELS_PER_TILE - 1)), y = Math.floor(Math.random() * (PIXELS_PER_TILE - 1)), r = Math.random(); let c = "#6b6a6a"; if (r > 0.5) c = "#505050"; if (r > 0.85) c = "#78909c"; fillLogicalPixel(lf, x, y, c); if (Math.random() > 0.5) fillLogicalPixel(lf, x + 1, y, c); else if (Math.random() > 0.5) fillLogicalPixel(lf, x, y + 1, c); }
    preCrack[TILE.CRACKED_STONE] = ctx.getImageData(lf, 0, TILE_SIZE, TILE_SIZE);
    drawCrackOverlay(lf, 12345 + TILE.CRACKED_STONE);

    // Tile 23: Cracked Dirt
    lf += TILE_SIZE;
    for (let y = 0; y < PIXELS_PER_TILE; y++) for (let x = 0; x < PIXELS_PER_TILE; x++) fillLogicalPixel(lf, x, y, dirtColors.shadow);
    for (let i = 0; i < dirtClumpCount; i++) { const x = Math.floor(Math.random() * (PIXELS_PER_TILE - 1)), y = Math.floor(Math.random() * (PIXELS_PER_TILE - 1)); fillLogicalPixel(lf, x, y, dirtColors.base); if (Math.random() > 0.3) fillLogicalPixel(lf, x + 1, y, dirtColors.base); if (Math.random() > 0.3) fillLogicalPixel(lf, x, y + 1, dirtColors.base); }
    for (let i = 0; i < dirtHighlightCount; i++) fillLogicalPixel(lf, Math.floor(Math.random() * PIXELS_PER_TILE), Math.floor(Math.random() * PIXELS_PER_TILE), dirtColors.highlight);
    for (let i = 0; i < dirtGritCount; i++) fillLogicalPixel(lf, Math.floor(Math.random() * PIXELS_PER_TILE), Math.floor(Math.random() * PIXELS_PER_TILE), dirtColors.grit);
    preCrack[TILE.CRACKED_DIRT] = ctx.getImageData(lf, 0, TILE_SIZE, TILE_SIZE);
    drawCrackOverlay(lf, 12345 + TILE.CRACKED_DIRT);

    // Tile 24: Cracked Planks
    lf += TILE_SIZE;
    for (let y = 0; y < PIXELS_PER_TILE; y++) for (let x = 0; x < PIXELS_PER_TILE; x++) fillLogicalPixel(lf, x, y, "#C19A6B");
    for (let i = 0; i < nd; i++) fillLogicalPixel(lf, Math.floor(Math.random() * PIXELS_PER_TILE), Math.floor(Math.random() * PIXELS_PER_TILE), Math.random() > 0.7 ? "#a17e55" : "#c9a77d");
    for (let row = PH - GS; row < PIXELS_PER_TILE; row += PH) for (let g = 0; g < GS; g++) for (let x = 0; x < PIXELS_PER_TILE; x++) { const r = Math.random(); fillLogicalPixel(lf, x, row + g, r > 0.7 ? "#6D4C41" : r > 0.9 ? "#5D4037" : "#8B5A2B"); }
    preCrack[TILE.CRACKED_PLANKS] = ctx.getImageData(lf, 0, TILE_SIZE, TILE_SIZE);
    drawCrackOverlay(lf, 12345 + TILE.CRACKED_PLANKS);

    return { canvas: cvs, tileSize: TILE_SIZE, pixelsPerTile: PIXELS_PER_TILE, preCrack };
}

// ============================================================
// AUTOMATED CHECKS
// ============================================================
function runChecks(atlas) {
    const checks = [];
    const ctx = atlas.canvas.getContext("2d");
    const TS = atlas.tileSize;
    const imgData = ctx.getImageData(0, 0, atlas.canvas.width, atlas.canvas.height);
    const data = imgData.data;

    for (let t = 0; t < NUM_TILES; t++) {
        const name = TILE_NAMES[t];
        const tileX = t * TS;

        // Count transparent pixels
        let transparent = 0, total = TS * TS, nonBlack = 0;
        let rSum = 0, gSum = 0, bSum = 0, minLum = 255;
        for (let py = 0; py < TS; py++) {
            for (let px = 0; px < TS; px++) {
                const i = ((py * atlas.canvas.width) + (tileX + px)) * 4;
                if (data[i + 3] < 255) transparent++;
                if (data[i] > 10 || data[i + 1] > 10 || data[i + 2] > 10) nonBlack++;
                rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2];
                minLum = Math.min(minLum, (data[i] + data[i + 1] + data[i + 2]) / 3);
            }
        }
        const avgR = rSum / total, avgG = gSum / total, avgB = bSum / total;

        // Check 1: Opaque tiles should have no transparent pixels
        if (!TRANSPARENT_TILES.has(t)) {
            checks.push({ name: `${name}: fully opaque`, pass: transparent === 0, detail: transparent > 0 ? `${transparent} transparent pixels` : '' });
        } else {
            // Transparent tiles should have SOME transparency
            checks.push({ name: `${name}: has transparency`, pass: transparent > 0, detail: `${transparent}/${total} transparent` });
        }

        // Check 2: Not all black (texture generated)
        checks.push({ name: `${name}: not empty`, pass: nonBlack > total * 0.1, detail: `${nonBlack}/${total} non-black` });

        // Check 3: Color sanity (average color in expected range)
        if (name === 'GRASS_TOP' || name === 'LEAF' || name === 'LONGWOOD_LEAF') {
            checks.push({ name: `${name}: green-dominant`, pass: avgG > avgR && avgG > avgB, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'WATER') {
            checks.push({ name: `${name}: blue-dominant`, pass: avgB > avgR && avgB > avgG, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'SNOW') {
            checks.push({ name: `${name}: bright (high avg)`, pass: avgR > 180 && avgG > 180 && avgB > 180, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'SAND') {
            checks.push({ name: `${name}: warm tone (R>B)`, pass: avgR > avgB, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'BEDROCK') {
            checks.push({ name: `${name}: dark (low avg)`, pass: avgR < 100 && avgG < 100, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'ICON_EXPLOSION') {
            checks.push({ name: `${name}: warm-dominant (R>B)`, pass: avgR > avgB, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'ICON_LASER' || name === 'ICON_FREEZE') {
            checks.push({ name: `${name}: cool-dominant (B>R)`, pass: avgB > avgR, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'ICE') {
            checks.push({ name: `${name}: pale-blue dominant`, pass: avgB >= avgR && avgB >= avgG && avgR > 140 && avgG > 150, detail: `avg RGB: ${avgR.toFixed(0)},${avgG.toFixed(0)},${avgB.toFixed(0)}` });
        } else if (name === 'CRACKED_STONE' || name === 'CRACKED_DIRT' || name === 'CRACKED_PLANKS') {
            // CCR-MAGIC-007 B1 (fixed after review): a luminance-based check is vacuous here --
            // STONE's own dark flecks and PLANKS' own grain stripes already sit >20 below their
            // tile's average luminance with or without the overlay running. Instead, diff this
            // tile's pixels against the preCrack snapshot taken JUST BEFORE drawCrackOverlay ran
            // (same base texture, so any difference is attributable to the overlay itself) and
            // require a meaningful fraction of pixels to have actually changed.
            const pre = atlas.preCrack[t].data;
            let changedPixels = 0;
            for (let py = 0; py < TS; py++) {
                for (let px = 0; px < TS; px++) {
                    const i = ((py * atlas.canvas.width) + (tileX + px)) * 4;
                    const j = (py * TS + px) * 4;
                    if (data[i] !== pre[j] || data[i + 1] !== pre[j + 1] || data[i + 2] !== pre[j + 2]) changedPixels++;
                }
            }
            checks.push({ name: `${name}: crack overlay actually changed pixels vs. the pre-overlay base`, pass: changedPixels > total * 0.02, detail: `${changedPixels}/${total} pixels changed by the overlay` });
        }
    }

    // Check: atlas dimensions
    checks.push({ name: `Atlas width = ${NUM_TILES} tiles`, pass: atlas.canvas.width === NUM_TILES * TS, detail: `${atlas.canvas.width}px` });
    checks.push({ name: `Atlas height = 1 tile`, pass: atlas.canvas.height === TS, detail: `${atlas.canvas.height}px` });

    return checks;
}

// ============================================================
// RENDERING
// ============================================================
function regenerate() {
    const res = parseInt(document.getElementById('res-select').value);
    const zoom = parseInt(document.getElementById('zoom-select').value);
    const atlas = generateAtlas(res);
    const TS = atlas.tileSize;

    // Full atlas
    const atlasContainer = document.getElementById('atlas-container');
    atlasContainer.innerHTML = '';
    atlas.canvas.style.width = (atlas.canvas.width * 2) + 'px';
    atlas.canvas.style.height = (TS * 2) + 'px';
    atlas.canvas.style.imageRendering = 'pixelated';
    atlasContainer.appendChild(atlas.canvas);

    // Individual tiles
    const grid = document.getElementById('tile-grid');
    grid.innerHTML = '';
    const srcCtx = atlas.canvas.getContext('2d');
    for (let t = 0; t < NUM_TILES; t++) {
        const card = document.createElement('div');
        card.className = 'tile-card';
        const canvas = document.createElement('canvas');
        canvas.width = TS; canvas.height = TS;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(atlas.canvas, t * TS, 0, TS, TS, 0, 0, TS, TS);
        canvas.style.width = (res * zoom) + 'px';
        canvas.style.height = (res * zoom) + 'px';
        if (TRANSPARENT_TILES.has(t)) card.classList.add('checker-bg');
        card.appendChild(canvas);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = TILE_NAMES[t];
        card.appendChild(label);
        const idEl = document.createElement('div');
        idEl.className = 'id';
        idEl.textContent = `Tile ${t} (${res}x${res})`;
        card.appendChild(idEl);
        grid.appendChild(card);
    }

    // Checks
    const checks = runChecks(atlas);
    const checkContainer = document.getElementById('check-results');
    checkContainer.innerHTML = '';
    let passCount = 0;
    for (const c of checks) {
        const el = document.createElement('div');
        el.className = 'check-item ' + (c.pass ? 'pass' : 'fail');
        el.textContent = (c.pass ? 'PASS' : 'FAIL') + ' ' + c.name;
        if (c.detail) el.textContent += ` (${c.detail})`;
        checkContainer.appendChild(el);
        if (c.pass) passCount++;
    }
    const summary = document.createElement('div');
    summary.className = 'check-item ' + (passCount === checks.length ? 'pass' : 'fail');
    summary.textContent = `${passCount}/${checks.length} checks passed`;
    summary.style.fontWeight = 'bold';
    checkContainer.prepend(summary);
}

window.addEventListener('load', regenerate);
</script>
