<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VoxEx Terrain Debugger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',monospace;background:#1a1a1a;color:#eee;padding:20px}
h1{color:#4caf50;margin-bottom:4px}
.subtitle{color:#888;margin-bottom:16px;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;background:#222;padding:10px 14px;border-radius:8px}
.controls label{font-size:13px;color:#aaa}
.controls input,.controls select{background:#333;color:#eee;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:13px;width:110px}
.controls input[type=checkbox]{width:auto;vertical-align:middle}
.controls button{background:#4caf50;color:#fff;border:none;padding:8px 16px;border-radius:4px;font-size:13px;cursor:pointer}
.controls button:disabled{background:#555;cursor:default}
.controls button:hover:not(:disabled){background:#66bb6a}
#main-canvas{border:1px solid #444;border-radius:4px;cursor:crosshair;display:block;margin-bottom:12px}
#cross-canvas{border:1px solid #444;border-radius:4px;display:block;margin-bottom:12px}
.info-bar{background:#222;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;min-height:40px;line-height:1.6}
.info-bar b{color:#4caf50}
.info-bar .val{color:#81c784}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#bbb;background:#222;padding:3px 8px;border-radius:4px}
.legend-swatch{width:12px;height:12px;border:1px solid #555;border-radius:2px}
.stats-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stat-chip{background:#222;padding:4px 10px;border-radius:4px;font-size:12px;color:#aaa}
.stat-chip span{color:#eee;font-weight:bold}
#banner{display:none;background:#3a1f1f;border:1px solid #a44;color:#fdd;padding:20px;border-radius:8px;line-height:1.7;font-size:14px;margin-bottom:12px}
#banner code{background:#000;color:#fca;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<h1>VoxEx Terrain Debugger</h1>
<p class="subtitle">Shaded relief surface view + cross-section. Click the terrain to inspect columns. All terrain data comes live from voxEx.html via the <code>?test=1</code> seam &mdash; no hand-synced copies.</p>

<div class="controls">
    <label>Seed: <input id="seed-input" value="test_seed_42"></label>
    <label>Center X: <input id="cx-input" type="number" value="0" step="32"></label>
    <label>Center Z: <input id="cz-input" type="number" value="0" step="32"></label>
    <label>Size: <select id="size-select"><option value="128">128</option><option value="192" selected>192</option><option value="256">256</option></select></label>
    <label title="Flip the live game's terrain pipeline. Both the new climate/spline system and the legacy biome-blend system route through the same VoxEx.blendedHeight / getBiomeParams dispatcher, so this shows exactly what each mode produces."><input type="checkbox" id="newterrain-toggle" checked> New terrain</label>
    <button id="generate-btn" onclick="generate()" disabled>Generate</button>
</div>
<div id="banner"></div>
<div class="legend" id="legend"></div>
<div class="stats-bar" id="stats"></div>
<div class="info-bar" id="info">Booting live game engine&hellip;</div>

<canvas id="main-canvas"></canvas>
<canvas id="cross-canvas"></canvas>

<!-- Hidden host: boots the real game with its ?test=1 seam so this tool can route ALL
     terrain/biome/noise sampling through window.VoxEx (no hand-copied duplicates). -->
<iframe id="game-frame" src="../voxEx.html?test=1" style="display:none" title="hidden voxEx host (terrain functions)"></iframe>

<script>
// ============================================================
// UI-ONLY CONSTANTS (block IDs + color/name lookup tables)
// These are presentation tables, not terrain logic. All height / biome / noise
// / ocean / river math is delegated to the live game via `VX` (window.VoxEx).
// ============================================================
const AIR=0,GRASS=1,DIRT=2,STONE=3,WOOD=4,LOG=5,LEAVES=6,BEDROCK=7,SAND=8,WATER=9,TORCH=10,SNOW=11,GRAVEL=12,LONGWOOD_LOG=13,LONGWOOD_LEAVES=14;

const BLOCK_RGB={[GRASS]:[76,175,80],[DIRT]:[121,85,72],[STONE]:[158,158,158],[BEDROCK]:[26,26,26],[SAND]:[230,214,172],[WATER]:[33,150,243],[SNOW]:[245,245,245],[GRAVEL]:[117,117,117],[LOG]:[93,64,55],[LEAVES]:[46,125,50],[LONGWOOD_LOG]:[61,42,31],[LONGWOOD_LEAVES]:[27,94,32]};
const BLOCK_NAMES={[AIR]:"Air",[GRASS]:"Grass",[DIRT]:"Dirt",[STONE]:"Stone",[BEDROCK]:"Bedrock",[SAND]:"Sand",[WATER]:"Water",[SNOW]:"Snow",[GRAVEL]:"Gravel",[LOG]:"Log",[LEAVES]:"Leaves"};
const BIOME_COLORS={plains:"#7cb342",hills:"#9ccc65",forests:"#2E7D32",mountains:"#78909c",mountain_foothills:"#8d6e63",swamp:"#5d4037",longwoods:"#1B5E20"};

// ============================================================
// LIVE GAME SEAM (window.VoxEx) — set once the hidden iframe boots.
// ============================================================
/** @type {object|null} The live game's ?test=1 seam (window.VoxEx). Null until the iframe boots. */
let VX = null;
const GAME_FRAME_TIMEOUT_MS = 15000;

/**
 * Poll the hidden game iframe until its window.VoxEx seam exists, then start the tool.
 * On timeout (e.g. served over file:// or seam removed), show the failure banner.
 * @returns {void}
 */
function bootVoxEx() {
    const frame = document.getElementById('game-frame');
    const start = performance.now();
    (function poll() {
        let seam = null;
        try { seam = frame.contentWindow && frame.contentWindow.VoxEx; } catch (e) { seam = null; }
        if (seam && typeof seam.blendedHeight === 'function' && typeof seam.seedNoise === 'function') {
            VX = seam;
            onVoxExReady();
            return;
        }
        if (performance.now() - start > GAME_FRAME_TIMEOUT_MS) {
            showFailureBanner();
            return;
        }
        setTimeout(poll, 80);
    })();
}

/**
 * Called once the VoxEx seam is available: sync the terrain-mode checkbox to the live
 * value, enable the Generate button, and render the first view.
 * @returns {void}
 */
function onVoxExReady() {
    const toggle = document.getElementById('newterrain-toggle');
    if (VX.WORLD_CONFIG && typeof VX.WORLD_CONFIG.useNewTerrain === 'boolean') {
        toggle.checked = VX.WORLD_CONFIG.useNewTerrain;
    }
    document.getElementById('generate-btn').disabled = false;
    document.getElementById('info').textContent = 'Click terrain to inspect a column.';
    generate();
}

/**
 * Replace the data UI with a clear message explaining the localhost requirement.
 * @returns {void}
 */
function showFailureBanner() {
    const banner = document.getElementById('banner');
    banner.style.display = 'block';
    banner.innerHTML =
        '<b>Terrain functions unavailable.</b><br>' +
        'This tool now uses the live game\'s terrain functions via a hidden ' +
        '<code>voxEx.html?test=1</code> iframe. Serve the repo over <b>localhost</b> ' +
        '(like <code>tools/voxex-tests.html</code>) and open this page via ' +
        '<code>http://localhost/&hellip;</code>. Opening the file directly with ' +
        '<code>file://</code> will not work (browsers block the iframe\'s scripts / cross-frame access).';
    for (const id of ['main-canvas', 'cross-canvas', 'stats', 'legend', 'info']) {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    }
    document.getElementById('generate-btn').disabled = true;
}

// ============================================================
// SURFACE BLOCK CLASSIFIER (local APPROXIMATION)
// The game's real surface-material selection lives inline in generateTerrainPass
// (a ~170-line cascade with chunk-border padding context) and is NOT factored into a
// standalone seam function, so we can't delegate it without duplicating that whole
// pass. This is a deliberate approximation for the debugger's shaded view — it may
// disagree with the real game near chunk borders and underwater. Its NOISE sampling,
// however, is routed through VX.noise2D so it stays seed-consistent with the live game.
// ============================================================
/**
 * Approximate the surface block for a column (grass/sand/stone/gravel/snow/dirt).
 * @param {number} gx - Global X.
 * @param {number} gz - Global Z.
 * @param {number} worldTopY - Surface height (from VX.blendedHeight).
 * @param {object} biome - Resolved biome (from VX.getBiomeParams); reads .tags.
 * @param {number[]} neighborHeights - [W, E, N, S] neighbour heights for slope.
 * @returns {number} A block ID.
 */
function getSurfaceBlock(gx, gz, worldTopY, biome, neighborHeights) {
    const seaLevel = VX.WORLD_DIMS.seaLevel;
    const isMountain = biome?.tags?.includes("mountain");
    const maxSlope = neighborHeights.reduce((mx, nh) => Math.max(mx, Math.abs(worldTopY - nh)), 0);
    let slopeNorth = 0, slopeSouth = 0;
    if (neighborHeights.length >= 4) { slopeNorth = worldTopY - neighborHeights[2]; slopeSouth = worldTopY - neighborHeights[3]; }
    const isCliff = maxSlope >= 8, isSteep = maxSlope >= 5, isModerate = maxSlope >= 3;
    const northFacing = slopeNorth > slopeSouth + 1, isExposedRidge = slopeNorth > 2 && slopeSouth > 2;
    const surfaceNoise = VX.noise2D(gx * 0.1, gz * 0.1), patchNoise = VX.noise2D(gx * 0.05 + 100, gz * 0.05 + 100);
    const detailNoise = VX.noise2D(gx * 0.2 + 200, gz * 0.2 + 200), screeNoise = VX.noise2D(gx * 0.08 + 300, gz * 0.08 + 300);
    let id = GRASS;
    if (worldTopY < seaLevel + 2 && worldTopY >= seaLevel - 1) id = SAND;
    else if (isMountain || worldTopY >= 85) {
        if (worldTopY >= 190) { if (isCliff) id = STONE; else if (isSteep) id = surfaceNoise > 0.3 ? STONE : GRAVEL; else if (isExposedRidge && detailNoise > 0.4) id = STONE; else id = SNOW; }
        else if (worldTopY >= 160) { if (isCliff) id = STONE; else if (northFacing && !isSteep && patchNoise > 0.2) id = SNOW; else if (!isModerate && patchNoise > 0.5) id = SNOW; else if (isSteep) id = surfaceNoise > 0 ? STONE : GRAVEL; else id = surfaceNoise > 0.3 ? STONE : GRAVEL; }
        else if (worldTopY >= 140) { if (isCliff) id = STONE; else if (isModerate && screeNoise > 0) id = GRAVEL; else if (northFacing && !isSteep && patchNoise > 0.6) id = SNOW; else id = surfaceNoise > 0.2 ? STONE : GRAVEL; }
        else if (worldTopY >= 110 || isCliff) { if (isCliff) id = STONE; else if (!isModerate && detailNoise > 0.6) id = STONE; else if (isModerate) id = screeNoise > 0 ? GRAVEL : STONE; else { const r = surfaceNoise + detailNoise * 0.5; id = r > 0.4 ? STONE : r > -0.2 ? GRAVEL : STONE; } }
        else if (worldTopY >= 85) { if (isCliff) id = STONE; else if (isSteep) id = surfaceNoise > 0 ? STONE : GRAVEL; else if (!isModerate) { if (patchNoise > 0.3) id = GRASS; else if (patchNoise > -0.2) id = DIRT; else id = surfaceNoise > 0 ? STONE : GRAVEL; } else { if (patchNoise > 0.5) id = GRASS; else if (patchNoise > 0) id = DIRT; else id = GRAVEL; } }
        else { if (isSteep) id = surfaceNoise > 0.3 ? STONE : GRAVEL; else if (isModerate) { if (patchNoise > -0.3) id = GRASS; else id = DIRT; } else { if (detailNoise > 0.7) id = STONE; else if (patchNoise > -0.4) id = GRASS; else id = DIRT; } }
    } else {
        if (isSteep) id = surfaceNoise > 0.5 ? STONE : DIRT;
        else if (detailNoise > 0.8) id = STONE;
        else id = GRASS;
    }
    if (id === GRASS && worldTopY < seaLevel) id = DIRT;
    return id;
}

// ============================================================
// RENDERING
// ============================================================
const SCALE = 3; // pixels per block on main view
let data = null; // { size, startX, startZ, heights, surfaces, biomes, seed, minH, maxH }

/**
 * Sample a square window of terrain through the live game seam and render both views.
 * @returns {void}
 */
function generate() {
    if (!VX) return;
    const seedStr = document.getElementById('seed-input').value;
    const centerX = parseInt(document.getElementById('cx-input').value) || 0;
    const centerZ = parseInt(document.getElementById('cz-input').value) || 0;
    const size = parseInt(document.getElementById('size-select').value);

    // Apply the A/B terrain-mode toggle to the live pipeline (both blendedHeight and
    // getBiomeParams dispatch on WORLD_CONFIG.useNewTerrain internally).
    VX.WORLD_CONFIG.useNewTerrain = document.getElementById('newterrain-toggle').checked;

    // Clear the game's legacy biome-cell cache: it's keyed by cell coords only (not seed),
    // so re-seeding with a new seed would otherwise read stale entries on the legacy path.
    if (VX.biomeCellCache && typeof VX.biomeCellCache.clear === 'function') VX.biomeCellCache.clear();
    // Re-seed the game's noise perm tables + worldConfig.seed from the user's seed string
    // (mirrors WorldPreviewRenderer.init in the live game), then read back the numeric seed.
    VX.seedNoise(seedStr);
    const seed = VX.worldSeed;
    const seaLevel = VX.WORLD_DIMS.seaLevel;
    const startX = centerX - (size >> 1), startZ = centerZ - (size >> 1);

    const heights = new Int16Array(size * size);
    const surfaces = new Uint8Array(size * size);
    const biomes = new Array(size * size);
    let minH = Infinity, maxH = -Infinity;
    const blockCounts = {};

    // Pass 1: heights + biomes (delegated to the real game)
    for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) {
        const idx = x + z * size, gx = startX + x, gz = startZ + z;
        heights[idx] = VX.blendedHeight(gx, gz, seed);
        biomes[idx] = VX.getBiomeParams(gx, gz);
        if (heights[idx] < minH) minH = heights[idx];
        if (heights[idx] > maxH) maxH = heights[idx];
    }
    // Pass 2: surface blocks (needs neighbor heights for slope)
    for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) {
        const idx = x + z * size, gx = startX + x, gz = startZ + z;
        const nh = [];
        for (const [dx, dz] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const ni = (x+dx) + (z+dz) * size;
            nh.push(ni >= 0 && ni < size*size && x+dx >= 0 && x+dx < size && z+dz >= 0 && z+dz < size ? heights[ni] : heights[idx]);
        }
        surfaces[idx] = getSurfaceBlock(gx, gz, heights[idx], biomes[idx], nh);
        blockCounts[surfaces[idx]] = (blockCounts[surfaces[idx]] || 0) + 1;
    }

    data = { size, startX, startZ, heights, surfaces, biomes, seed, minH, maxH };

    // Stats
    const statsEl = document.getElementById('stats');
    const total = size * size;
    const modeLabel = VX.WORLD_CONFIG.useNewTerrain ? 'new (climate/spline)' : 'legacy (biome-blend)';
    statsEl.innerHTML = `<div class="stat-chip">Mode: <span>${modeLabel}</span></div><div class="stat-chip">Seed#: <span>${seed.toFixed(4)}</span></div><div class="stat-chip">Height: <span>${minH}&ndash;${maxH}</span></div><div class="stat-chip">Sea: <span>${seaLevel}</span></div>` +
        Object.entries(blockCounts).sort((a,b)=>b[1]-a[1]).map(([bid,count])=>`<div class="stat-chip">${BLOCK_NAMES[bid]||bid}: <span>${(count/total*100).toFixed(1)}%</span></div>`).join('');

    // Legend
    document.getElementById('legend').innerHTML = Object.entries(BLOCK_RGB)
        .filter(([id]) => blockCounts[id])
        .map(([id,[r,g,b]])=>`<div class="legend-item"><div class="legend-swatch" style="background:rgb(${r},${g},${b})"></div>${BLOCK_NAMES[id]||id}</div>`).join('');

    renderMainView();
    renderCrossSection(Math.floor(size / 2));
}

/**
 * Draw the top-down shaded-relief view.
 * @returns {void}
 */
function renderMainView() {
    if (!data) return;
    const { size, heights, surfaces, minH, maxH } = data;
    const seaLevel = VX.WORLD_DIMS.seaLevel;
    const canvas = document.getElementById('main-canvas');
    canvas.width = size * SCALE;
    canvas.height = size * SCALE;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size, size);
    const d = img.data;

    for (let z = 0; z < size; z++) for (let x = 0; x < size; x++) {
        const idx = x + z * size;
        const h = heights[idx];
        const block = surfaces[idx];
        const i = idx * 4;

        // Base color from block type
        let rgb = BLOCK_RGB[block] || [255, 0, 255];
        let [r, g, b] = rgb;

        // Height-based shading (simulate light from NW)
        const hN = z > 0 ? heights[x + (z-1) * size] : h;
        const hW = x > 0 ? heights[(x-1) + z * size] : h;
        const slopeShade = ((h - hN) + (h - hW)) * 4; // NW illumination
        const heightBright = 0.6 + ((h - minH) / (maxH - minH || 1)) * 0.4;

        r = Math.min(255, Math.max(0, r * heightBright + slopeShade));
        g = Math.min(255, Math.max(0, g * heightBright + slopeShade));
        b = Math.min(255, Math.max(0, b * heightBright + slopeShade));

        // Water: blend with depth (blendedHeight already carves rivers + oceans below sea level)
        if (h < seaLevel) {
            const waterDepth = seaLevel - h;
            const waterAlpha = Math.min(0.9, waterDepth / 30);
            r = r * (1 - waterAlpha) + 25 * waterAlpha;
            g = g * (1 - waterAlpha) + 100 * waterAlpha;
            b = b * (1 - waterAlpha) + 200 * waterAlpha;
        }

        d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
    }

    // Scale up with nearest neighbor
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = size; tempCanvas.height = size;
    tempCanvas.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tempCanvas, 0, 0, size * SCALE, size * SCALE);

    canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / SCALE);
        const z = Math.floor((e.clientY - rect.top) / SCALE);
        if (x >= 0 && x < size && z >= 0 && z < size) {
            renderCrossSection(z);
            showColumnInfo(x, z);
            // Draw selection crosshair
            renderMainView();
            const ctx2 = canvas.getContext('2d');
            ctx2.strokeStyle = '#ff0'; ctx2.lineWidth = 1;
            ctx2.strokeRect(x * SCALE, z * SCALE, SCALE, SCALE);
            // Horizontal line for cross-section
            ctx2.strokeStyle = 'rgba(255,255,0,0.3)'; ctx2.lineWidth = 1;
            ctx2.beginPath(); ctx2.moveTo(0, z * SCALE + SCALE/2); ctx2.lineTo(size * SCALE, z * SCALE + SCALE/2); ctx2.stroke();
        }
    };
}

/**
 * Draw the vertical cross-section for a given Z slice.
 * @param {number} sliceZ - Local Z index within the sampled window.
 * @returns {void}
 */
function renderCrossSection(sliceZ) {
    if (!data) return;
    const { size, startX, startZ, heights, surfaces } = data;
    const seaLevel = VX.WORLD_DIMS.seaLevel;
    const canvas = document.getElementById('cross-canvas');
    const yScale = 2; // Vertical exaggeration
    // Find visible Y range for this slice
    let sliceMin = Infinity, sliceMax = -Infinity;
    for (let x = 0; x < size; x++) { const h = heights[x + sliceZ * size]; sliceMin = Math.min(sliceMin, h); sliceMax = Math.max(sliceMax, h); }
    const padBot = 15, padTop = 10;
    const viewMin = Math.max(0, sliceMin - padBot);
    const viewMax = Math.min(320, sliceMax + padTop);
    const viewH = viewMax - viewMin;
    canvas.width = size * SCALE;
    canvas.height = viewH * yScale;
    const ctx = canvas.getContext('2d');

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#87CEEB'); skyGrad.addColorStop(1, '#b0d4e8');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < size; x++) {
        const idx = x + sliceZ * size;
        const h = heights[idx];
        const surfBlock = surfaces[idx];

        for (let y = viewMin; y <= Math.min(viewMax, h); y++) {
            const canvasY = (viewMax - y) * yScale;
            const depth = h - y;
            let rgb;
            if (y <= 0) rgb = BLOCK_RGB[BEDROCK];
            else if (depth === 0) rgb = BLOCK_RGB[surfBlock] || [255,0,255];
            else if (depth < 4) rgb = BLOCK_RGB[DIRT];
            else rgb = BLOCK_RGB[STONE];

            // Darken subsurface slightly
            let [r, g, b] = rgb;
            if (depth > 0) { const dim = Math.max(0.5, 1 - depth * 0.02); r *= dim; g *= dim; b *= dim; }

            ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
            ctx.fillRect(x * SCALE, canvasY, SCALE, yScale);
        }

        // Water column
        if (h < seaLevel) {
            for (let y = h + 1; y <= seaLevel; y++) {
                if (y >= viewMin && y <= viewMax) {
                    const canvasY = (viewMax - y) * yScale;
                    const waterDepth = seaLevel - y;
                    ctx.fillStyle = `rgba(33,150,243,${0.3 + waterDepth/40*0.5})`;
                    ctx.fillRect(x * SCALE, canvasY, SCALE, yScale);
                }
            }
        }
    }

    // Sea level line
    if (seaLevel >= viewMin && seaLevel <= viewMax) {
        const slY = (viewMax - seaLevel) * yScale;
        ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(0, slY); ctx.lineTo(canvas.width, slY); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#2196F3'; ctx.font = '11px monospace'; ctx.fillText(`sea level (${seaLevel})`, 4, slY - 3);
    }

    // Y-axis labels
    ctx.fillStyle = '#aaa'; ctx.font = '10px monospace';
    for (let y = Math.ceil(viewMin / 10) * 10; y <= viewMax; y += 10) {
        const cy = (viewMax - y) * yScale;
        ctx.fillText(y.toString(), 2, cy + 4);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(25, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
    }

    // Label
    ctx.fillStyle = '#aaa'; ctx.font = '12px monospace';
    ctx.fillText(`Cross-section at Z=${startZ + sliceZ}`, canvas.width - 220, 14);
}

/**
 * Populate the info bar with per-column detail (delegated readouts).
 * @param {number} x - Local X within the sampled window.
 * @param {number} z - Local Z within the sampled window.
 * @returns {void}
 */
function showColumnInfo(x, z) {
    if (!data) return;
    const { size, startX, startZ, heights, surfaces, biomes, seed } = data;
    const idx = x + z * size;
    const gx = startX + x, gz = startZ + z;
    const h = heights[idx], block = surfaces[idx], biome = biomes[idx];
    const sn = VX.noise2D(gx * 0.1, gz * 0.1), pn = VX.noise2D(gx * 0.05 + 100, gz * 0.05 + 100);
    const dn = VX.noise2D(gx * 0.2 + 200, gz * 0.2 + 200);
    // River / ocean carve factors (live from the game): 1 = untouched land, 0 = full channel/ocean.
    const oceanF = VX.getOceanFactor(gx, gz, seed);
    const riverF = VX.getRiverFactor(gx, gz, seed);
    // Determine slope
    const nh = [[-1,0],[1,0],[0,-1],[0,1]].map(([dx,dz])=>{const ni=(x+dx)+(z+dz)*size;return ni>=0&&ni<size*size&&x+dx>=0&&x+dx<size&&z+dz>=0&&z+dz<size?heights[ni]:h;});
    const maxSlope = nh.reduce((mx,v)=>Math.max(mx,Math.abs(h-v)),0);
    const slopeLabel = maxSlope >= 8 ? 'CLIFF' : maxSlope >= 5 ? 'STEEP' : maxSlope >= 3 ? 'MODERATE' : 'gentle';

    // New-terrain climate fields (cosmetic biome selection inputs). All read worldConfig.seed
    // internally; present only when the new pipeline is active.
    let climateLine = '';
    if (VX.WORLD_CONFIG.useNewTerrain) {
        climateLine =
            `<br>temp=<span class="val">${VX.temperature(gx,gz).toFixed(3)}</span> &nbsp; ` +
            `humid=<span class="val">${VX.humidity(gx,gz).toFixed(3)}</span> &nbsp; ` +
            `contin=<span class="val">${VX.continentalness(gx,gz).toFixed(3)}</span> &nbsp; ` +
            `erosion=<span class="val">${VX.erosionParam(gx,gz).toFixed(3)}</span> &nbsp; ` +
            `peaksValleys=<span class="val">${VX.peaksValleys(gx,gz).toFixed(3)}</span>`;
    }

    const rgb = BLOCK_RGB[block] || [128,128,128];
    document.getElementById('info').innerHTML =
        `<b>Column (${gx}, ${gz})</b> &nbsp; Height: <span class="val">${h}</span> &nbsp; ` +
        `Surface: <span style="color:rgb(${rgb.join(',')})">${BLOCK_NAMES[block]}</span> &nbsp; ` +
        `Biome: <span style="color:${BIOME_COLORS[biome.name]||'#ccc'}">${biome.name}</span> &nbsp; ` +
        `Slope: <span class="val">${maxSlope} (${slopeLabel})</span><br>` +
        `oceanFactor=<span class="val">${oceanF.toFixed(3)}</span> &nbsp; ` +
        `riverFactor=<span class="val">${riverF.toFixed(3)}</span> &nbsp; ` +
        `surfaceNoise=<span class="val">${sn.toFixed(3)}</span> &nbsp; ` +
        `patchNoise=<span class="val">${pn.toFixed(3)}</span> &nbsp; ` +
        `detailNoise=<span class="val">${dn.toFixed(3)}</span> &nbsp; ` +
        `isMountain=<span class="val">${biome.tags?.includes("mountain")}</span> &nbsp; ` +
        `elevation zone: <span class="val">${h>=190?'SNOW':h>=160?'SNOW_PATCHES':h>=140?'HIGH_ROCK':h>=110?'ROCK':h>=85?'ALPINE':'LOWLAND'}</span>` +
        climateLine;
}

window.addEventListener('load', bootVoxEx);
</script>
</body>
</html>
