name: checks

# Automated gates between a commit and the live GitHub Pages deployment.
# These are the headless subset of the verification ladder (CLAUDE.md):
# in-game visual checks remain manual.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate (all script blocks parse, no truncation)
        run: node tools/syntax-check.mjs voxEx.html
      - name: Lockstep parity (hand-maintained copies + injection markers)
        run: node tools/parity-check.mjs voxEx.html
      - name: Terrain invariants — seed 1
        run: node tools/terrain-node-checks.mjs voxEx.html ci-seed-alpha
      - name: Terrain invariants — seed 2
        run: node tools/terrain-node-checks.mjs voxEx.html ci-seed-bravo
      - name: Terrain invariants — seed 3
        run: node tools/terrain-node-checks.mjs voxEx.html ci-seed-charlie
      - name: Browser suite (headless — full 315+ tests)
        run: node tools/run-browser-tests.mjs --timeout=420
        env:
          CHROME: /usr/bin/google-chrome
